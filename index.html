        (i.status !== '승인된 설명' ? '<button class="btn small primary" data-act="advance-impact" data-id="' + esc(i.id) + '">' + (i.status === '확인 필요' ? '검토 시작' : '설명 승인·공개') + '</button>' : '') + '</div>' +
        '<div class="small" style="margin-top:6px">' + i.docIds.map(docChip).join(' ') + '</div></div>';
    });
    return h;
  }

  // ---------- 서랍: 문헌·카드 ----------
  function drawerHtml() {
    if (!drawer) return '';
    let h = '<div class="drawer-bg" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1" id="drawer"><button class="btn small close" data-act="close-drawer" aria-label="닫기">닫기 ✕</button>';
    if (drawer.kind === 'doc') {
      const d = F.getDoc(drawer.id);
      const inBase = curBase().docIds.indexOf(d.id) >= 0;
      const citing = state.cards.filter(function (c) { return c.evidence.indexOf(d.id) >= 0; });
      const fam = D.DOCS.filter(function (x) { return x.familyId === d.familyId && x.id !== d.id; });
      h += '<h2 id="drawer-title" style="margin-top:4px">' + esc(d.id) + '</h2><div class="row">' + (inBase ? '<span class="badge b-calc">기준선 ' + esc(state.currentBaseline) + ' 포함</span>' : '<span class="badge b-pending">정리 중 · 집계 제외</span>') + '<span class="badge b-neutral">가상 문헌</span></div>' +
        '<p><b>' + esc(d.title) + '</b></p><dl class="kv"><dt>가상 출원인</dt><dd>' + esc(d.applicant) + '</dd><dt>국가 · 공개연도</dt><dd>' + esc(D.COUNTRIES[d.country]) + ' · ' + d.year + '</dd>' +
        '<dt>가상 패밀리</dt><dd>' + esc(d.familyId) + (fam.length ? ' (함께: ' + fam.map(function (x) { return esc(x.id); }).join(', ') + ')' : '') + '</dd>' +
        '<dt>세부 분류</dt><dd>' + esc(D.SUBS[d.sub]) + '</dd><dt>결합 수단</dt><dd>' + esc(d.mech) + '</dd></dl>' +
        '<h3>세 축 등급 ' + (inBase ? '(가상값)' : '(초안 · 미확정)') + '</h3><table><tbody><tr><td>벤치마킹 가치</td><td>' + lvl(d.bench) + '</td></tr><tr><td>개발방향 관련성</td><td>' + lvl(d.rel) + '</td></tr><tr><td>권리검토 필요도</td><td>' + lvl(d.rights) + '</td></tr></tbody></table>' +
        '<p class="small muted">세 축은 서로 다른 뜻입니다. 벤치마킹 가치가 높다고 침해 위험이 크다는 뜻이 아니며, 실제 전문가 평가가 아닙니다.</p>' +
        '<h3>가상 원문</h3><div class="quote">' + esc(d.claim) + '</div><div class="quote">' + esc(d.paragraph) + '</div>' +
        '<h3>이 문헌을 근거로 쓴 카드</h3>' + (citing.length ? citing.map(function (c) { return '<div><button class="link" data-act="card" data-id="' + c.id + '">' + esc(c.title) + '</button><div class="small muted">' + esc(c.report) + '</div></div>'; }).join('') : '<p class="small muted">없음</p>');
    } else {
      const c = state.cards.find(function (x) { return x.id === drawer.id; });
      const runId = drawer.runId || c.runIds[c.runIds.length - 1];
      const run = state.runs[runId];
      const latest = state.runs[c.runIds[c.runIds.length - 1]];
      h += '<div class="row" style="margin-top:4px"><span class="badge b-neutral">' + esc(c.type) + '</span>' + layerBadge(c.layer) + '<span class="small muted">' + esc(c.id) + '</span></div>' +
        '<h2 id="drawer-title">' + esc(c.title) + '</h2>';
      if (c.runIds.length > 1) h += '<div class="row" role="group" aria-label="결과 버전">' + c.runIds.map(function (id, i) {
        const r = state.runs[id];
        return '<button class="btn small' + (id === runId ? ' primary' : '') + '" data-act="card-version" data-id="' + id + '">' + (i === 0 ? '당시 결과' : '재계산 ' + i) + ' · ' + esc(r.baseline) + ' · ' + esc(id) + '</button>';
      }).join('') + '</div>';
      if (latest.baseline !== state.currentBaseline) h += '<div class="note warn">현재 기준선은 ' + esc(state.currentBaseline) + '입니다. 이 카드의 수치는 ' + esc(latest.baseline) + ' 기준이며 몰래 바꾸지 않습니다. <button class="btn small primary" data-act="rerun-card" data-id="' + c.id + '">최신 기준선으로 다시 계산</button></div>';
      if (c.layer === 'review') h += '<div class="note risk">이 카드는 권리 검토가 필요한 문헌의 <b>목록</b>입니다. 침해·비침해·회피·무효 결론을 담고 있지 않습니다.</div>';
      h += runBlock(run, { explain: c.layer === 'explain' });
      h += '<div class="sec"><div class="sec-title">카드 근거 문헌 (보고서 작성 당시 인용)</div><div class="row">' + c.evidence.map(docChip).join('') + '</div></div>' +
        '<div class="sec"><div class="sec-title">원본 보고서 위치</div>' + esc(c.report) + '</div>' +
        '<div class="sec"><div class="sec-title">재검토 조건</div>' + esc(c.recheck) + '</div>' +
        '<div class="sec"><div class="sec-title">연결 개발과제</div>' + c.tasks.map(function (t) { return esc(task(t).title); }).join(', ') + '</div>';
    }
    return h + '</aside>';
  }

  // ---------- 가이드 ----------
  function guideHtml() {
    if (!state.guideOpen) return '';
    const g = GUIDE[state.guideStep];
    return '<section class="guide" aria-label="시연 가이드"><div class="row"><span class="steps">시연 가이드 ' + (state.guideStep + 1) + ' / ' + GUIDE.length + '</span><span class="spacer"></span><button class="btn small" data-act="guide-close" aria-label="가이드 닫기">✕</button></div>' +
      '<h3>' + esc(g.t) + '</h3><p>' + esc(g.b) + '</p><div class="row"><button class="btn small" data-act="guide-prev"' + (state.guideStep === 0 ? ' disabled' : '') + '>이전</button>' +
      '<button class="btn small primary" data-act="guide-go">이 단계 화면 열기</button><button class="btn small" data-act="guide-next"' + (state.guideStep === GUIDE.length - 1 ? ' disabled' : '') + '>다음</button></div></section>';
  }

  // ---------- 전체 렌더 ----------
  function render() {
    if (state.view === 'ask') state.unreadAnswers = 0;   // 물어보기를 열면 도착 답변을 읽은 것으로 처리
    const b = curBase();
    const bDocs = F.docsInBaseline(state);
    const pendingReq = state.requests.filter(function (r) { return r.status !== '답변 공개'; }).length;
    const views = VIEWS.slice();
    const top = '<header class="top"><div class="top-row"><div class="brand">FDE 특허·연구 작업공간 <small>' + esc(D.PROJECT.name) + ' · ' + esc(D.PROJECT.group) + '</small></div>' +
      '<span class="baseline-badge" id="baseline-badge" title="모든 수치는 이 기준선에서 계산됩니다">기준선 ' + esc(b.id) + ' · ' + esc(b.approvedAt) + ' 승인 · 문헌 ' + bDocs.length + '건</span>' +
      '<div class="role-switch" role="group" aria-label="시연 역할 전환"><button data-act="role" data-id="researcher" aria-pressed="' + (state.role === 'researcher') + '">연구자</button><button data-act="role" data-id="fde" aria-pressed="' + (state.role === 'fde') + '">컨설턴트(FDE)</button></div>' +
      '<button class="btn small" data-act="guide-open">시연 가이드</button><button class="btn small" data-act="reset">초기화</button></div>' +
      '<div class="demo-banner">가상 데이터 시연 — 모든 문헌·출원인·과제·보고서·검토 의견은 가상이며, 응답은 규칙 기반입니다(실제 AI·특허 DB·서버 미연결).' + (storageOk ? '' : ' <b>브라우저 저장이 차단되어 새로고침하면 처음 상태로 돌아갑니다.</b>') + '</div></header>';
    let nav = '<nav class="side" aria-label="주 메뉴">' + views.map(function (v) {
      let badge = '';
      if (v[0] === 'ask' && state.unreadAnswers) badge = '<span class="count" aria-label="새 답변">' + state.unreadAnswers + '</span>';
      if (v[0] === 'updates' && state.impacts.some(function (i) { return i.status === '확인 필요'; })) badge = '<span class="count">!</span>';
      return '<button data-act="nav" data-id="' + v[0] + '"' + (state.view === v[0] ? ' aria-current="page"' : '') + '>' + esc(v[1]) + badge + '</button>';
    }).join('');
    nav += '<div class="fde-only"><button data-act="nav" data-id="workbench"' + (state.view === 'workbench' ? ' aria-current="page"' : '') + '>컨설턴트 작업대' + (pendingReq ? '<span class="count">' + pendingReq + '</span>' : '') + '</button></div></nav>';
    const V = { today: viewToday, ask: viewAsk, browse: viewBrowse, tasks: viewTasks, updates: viewUpdates, saved: viewSaved, workbench: viewWorkbench };
    const body = (V[state.view] || viewToday)();
    document.getElementById('app').innerHTML = top + '<div class="layout">' + nav + '<main id="main">' + body + '</main></div>';
    document.getElementById('overlay').innerHTML = drawerHtml() + guideHtml();
    const hd = document.querySelector('header.top');
    if (hd) document.documentElement.style.setProperty('--head-h', hd.offsetHeight + 'px');
    const dr = document.getElementById('drawer'); if (dr) dr.focus();
  }

  // ---------- CSV 내려받기 ----------
  function downloadCsv(runId) {
    const run = state.runs[runId];
    try {
      const blob = new Blob(['﻿' + F.csvForRun(run)], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'FDE_' + run.id + '_' + run.baseline + '.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(run.id + ' CSV를 내려받았습니다.');
    } catch (e) { toast('CSV를 만들지 못했습니다: 이 브라우저에서 다운로드가 차단되었습니다.'); }
  }

  function askAndShow(q) {
    state.view = 'ask'; drawer = null;
    const m = F.ask(state, q);
    commit();
    if (m) {
      const last = document.querySelector('#thread > :last-child');
      if (last) last.scrollIntoView({ block: 'start' });
    }
  }

  // ---------- 이벤트 ----------
  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    let r;
    switch (act) {
      case 'nav': go(id); break;
      case 'role': setRole(id); toast(id === 'fde' ? '컨설턴트(FDE) 화면 — 시연용 전환이며 인증이 아닙니다' : '연구자 화면'); break;
      case 'task-select': state.activeTaskId = id; commit(); break;
      case 'quick-ask': askAndShow(el.getAttribute('data-q')); break;
      case 'clear-filter': F.clearCtxFilter(state, id); commit(); break;
      case 'save':
        r = F.saveRun(state, id);
        commit(r.ok ? r.saved.id + '로 저장했습니다. 저장 결과에서 볼 수 있습니다.' : r.reason); break;
      case 'csv': downloadCsv(id); break;
      case 'doc': drawer = { kind: 'doc', id: id }; render(); break;
      case 'card': drawer = { kind: 'card', id: id }; render(); break;
      case 'card-version': drawer.runId = id; render(); break;
      case 'close-drawer': drawer = null; render(); break;
      case 'rerun-card':
        r = F.rerunCard(state, id); if (r.ok) drawer.runId = r.run.id;
        commit(r.ok ? '새 실행 ' + r.run.id + '(' + r.run.baseline + ')를 만들었습니다. 당시 결과는 그대로 남습니다.' : r.reason); break;
      case 'request':
        r = F.requestReview(state, id); commit(r.ok ? r.request.id + ' 전문 검토를 요청했습니다.' : r.reason); break;
      case 'publish-answer':
        r = F.publishAnswer(state, id); commit(r.ok ? '가상 답변을 공개했습니다. 연구자 화면에 도착 표시가 됩니다.' : r.reason); break;
      case 'review-cand': F.reviewCandidate(state, id); commit(); break;
      case 'review-all': state.candidates.forEach(function (c) { F.reviewCandidate(state, c.docId); }); commit('후보 6건을 모두 검토 완료로 표시했습니다.'); break;
      case 'publish-v2':
        r = F.publishBaseline(state); commit(r.ok ? 'V2 기준선을 공개했습니다. 과제 영향은 “확인 필요”로 표시됩니다.' : r.reason); break;
      case 'advance-impact': r = F.advanceImpact(state, id); commit(r.ok ? r.impact.id + ' → ' + r.impact.status : r.reason); break;
      case 'rerun':
        r = F.rerunSaved(state, id); commit(r.ok ? '새 실행 ' + r.run.id + '(' + r.run.baseline + ')로 재실행했습니다. 저장된 결과는 바뀌지 않았습니다.' : r.reason); break;
      case 'task-edit': editingTask = id; render(); { const ta = document.getElementById('p-' + id); if (ta) ta.focus(); } break;
      case 'task-cancel': editingTask = null; render(); break;
      case 'guide-open': state.guideOpen = true; commit(); break;
      case 'guide-close': state.guideOpen = false; commit(); break;
      case 'guide-next': state.guideStep = Math.min(GUIDE.length - 1, state.guideStep + 1); commit(); break;
      case 'guide-prev': state.guideStep = Math.max(0, state.guideStep - 1); commit(); break;
      case 'guide-go': GUIDE[state.guideStep].go(); break;
      case 'reset':
        if (window.confirm('시연을 처음 상태로 되돌릴까요? 저장 결과와 요청이 모두 지워집니다.')) {
          F.clearStorage(safeStorage());
          state = F.createInitialState(); drawer = null; editingTask = null; browse = { q: '', sub: '', type: '' };
          commit('처음 상태로 초기화했습니다.');
        }
        break;
    }
  });

  document.addEventListener('submit', function (e) {
    const f = e.target;
    if (f.id === 'ask-form') {
      e.preventDefault();
      const i = document.getElementById('ask-input');
      const q = i.value; if (!q.trim()) return;
      askAndShow(q);
      const ni = document.getElementById('ask-input'); if (ni) ni.focus();
    } else if (f.getAttribute('data-form') === 'task') {
      e.preventDefault();
      const id = f.getAttribute('data-id');
      const r = F.updateTask(state, id, { problem: f.problem.value, constraints: f.constraints.value, decisionDate: f.decisionDate.value });
      if (r.ok) editingTask = null;
      commit(r.ok ? '과제를 수정했습니다(연구자 수정으로 표시).' : r.reason);
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'browse-q') { browse.q = e.target.value; document.getElementById('browse-results').innerHTML = browseResults(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'browse-sub') { browse.sub = e.target.value; document.getElementById('browse-results').innerHTML = browseResults(); }
    if (e.target.id === 'browse-type') { browse.type = e.target.value; document.getElementById('browse-results').innerHTML = browseResults(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && drawer) { drawer = null; render(); }
  });

  window.__FDE_UI = { getState: function () { return state; } };
  commit();
})();
</script>
