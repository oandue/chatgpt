        '<div class="sec"><div class="sec-title">결론</div>이 질문은 침해·회피·무효에 관한 <b>새로운 권리 판단</b>이므로 자동으로 결론을 내지 않습니다. 관련 문헌과 쟁점 초안만 보여 드리고 전문 검토로 연결합니다.</div>' +
        '<div class="sec"><div class="sec-title">관련 문헌 · 권리검토 필요도 높음 (' + m.docIds.length + '건, 기준선 ' + esc(state.currentBaseline) + ')</div><div class="row">' + m.docIds.map(docChip).join('') + '</div></div>' +

        '<div class="sec"><div class="sec-title">다음 행동</div><div class="row">' + act + '</div></div></div>';

      return '<div class="msg-bot" style="border-color:#b7c8f2">' + layerBadge('published') + ' <span class="small muted">' + esc(r.id) + ' · “' + esc(r.question) + '”</span>' +

        '<div class="note warn">가상 예시입니다. 실제 변리사 의견이 아니며 정식 감정·의견서가 아닙니다.</div></div>';
    }
    if (m.type === 'ip') {
      const IP = D.IP;
      return '<div class="msg-bot">' + layerBadge('explain') +
        '<div class="sec"><div class="sec-title">결론</div>벤치마킹 대상(' + esc(IP.target.name) + ')의 약점 ' + IP.weaknesses.length + '가지에 개선안 ' + IP.options.length + '개와 보강 기술 ' + IP.addons.length + '개를 제안했습니다. 기업 선호안 ④는 상업성이 높지만 단독 특허성은 낮아, 보강 기술 ' + IP.addons.filter(function (a) { return a.rec; }).map(function (a) { return a.k; }).join('·') + '를 얹는 조합을 1차 출원안으로 제안합니다(가상 예시).</div>' +
        '<div class="sec"><div class="sec-title">개선안</div><div class="tablewrap"><table><thead><tr><th>안</th><th>해결하는 약점</th><th>핵심 구조</th><th>특허성</th><th>상업성</th></tr></thead><tbody>' +
        IP.options.map(function (o) { return '<tr><td><b>' + esc(o.no + ' ' + o.name) + '</b>' + (o.pick ? ' <span class="badge b-info">기업 선호</span>' : '') + '</td><td>' + esc(o.weak) + '</td><td>' + esc(o.core) + '</td><td>' + lvl(o.pat) + '</td><td>' + lvl(o.com) + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +

      return '<div class="msg-bot"><span class="badge b-neutral">지원하지 않는 질문</span><div class="sec">이 시연은 정해진 유형의 질문만 처리하며, 처리할 수 없는 질문에 답을 꾸며내지 않습니다. 다음과 같은 질문을 해 보세요.</div><div class="examples">' +

        (r.status === '답변 공개' ? '<div class="note ok">가상 답변을 공개했습니다. 연구자 물어보기 화면에 도착 표시가 됩니다.</div>' :
          '<div class="row" style="margin-top:8px"><button class="btn primary small" data-act="publish-answer" data-id="' + esc(r.id) + '">가상 답변 예시 공개</button><span class="small muted">실제 서비스에서는 변리사 검수를 거친 의견만 공개합니다.</span></div>') + '</div>';

      state.candidates.map(function (c) {
        const d = F.getDoc(c.docId);
        return '<tr><td>' + docChip(d.id) + '</td><td>' + esc(d.title) + '</td><td class="small">' + esc(c.kind) + '</td><td class="small">' + esc(D.SUB_SHORT[d.sub]) + ' · ' + esc(d.mechs.join(', ')) + '</td><td class="small">' + esc(d.rel) + '</td><td class="small">' + lvl(d.bench) + ' · ' + lvl(d.relG) + ' · ' + lvl(d.rights) + '</td><td>' +
          (c.reviewed ? '<span class="badge b-calc">검토 완료</span>' : '<button class="btn small" data-act="review-cand" data-id="' + esc(d.id) + '">검토 완료</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:10px">' + (F.baselineOf(state, 'V2') ? '<span class="badge b-calc">V2 공개됨 · 문헌 ' + F.docsInBaseline(state, 'V2').length + '건</span>' :

    h += '<h2>3. 과제 영향 검토</h2>';
    if (!state.impacts.length) h += '<div class="note">V2를 공개하면 영향받은 과제가 여기에 “확인 필요”로 나타납니다.</div>';
    state.impacts.forEach(function (i) {
      h += '<div class="panel"><div class="row"><b>' + esc(task(i.taskId).title) + '</b><span class="badge ' + (i.status === '승인된 설명' ? 'b-calc' : 'b-pending') + '">' + esc(i.status) + '</span><span class="small muted">' + esc(i.id) + '</span><span class="spacer"></span>' +

        '<div class="small" style="margin-top:6px">' + i.docIds.map(docChip).join(' ') + '</div></div>';

      F.riskRows(state).map(function (r) {
        const d = F.getDoc(r.docId);
        return '<tr><td>' + docChip(d.id) + '</td><td class="small">' + esc(d.title) + '</td><td>' + riskBadge(r.prelim) + '</td><td class="small">' + esc(r.status) + '</td><td>' +
          (r.status === '의견 공개' ? '' : '<button class="btn small" data-act="publish-risk" data-id="' + esc(d.id) + '">가상 의견 공개</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    h += '<h2>5. 발명 후보 단계</h2>';
    state.ipCandidates.forEach(function (c) {
      h += '<div class="panel"><div class="row"><b>' + esc(c.id) + '</b> ' + esc(c.title) + '<span class="spacer"></span>' + icFlow(c.status) +
        (c.status !== '채택' ? '<button class="btn small primary" data-act="advance-ic" data-id="' + esc(c.id) + '">다음 단계로</button>' : '') + '</div><div class="small muted" style="margin-top:4px">' + esc(c.basis) + '</div></div>';
    });
    return h;
  }

  function riskBadge(g) { return '<span class="badge ' + (g === '상' ? 'b-review' : g === '중' ? 'b-pending' : 'b-calc') + '">' + esc(g) + '</span>'; }
  function icFlow(status) {
    const i = F.IC_FLOW.indexOf(status);
    return '<span class="flow-pills">' + F.IC_FLOW.map(function (s, k) { return '<i class="' + (k < i ? 'done' : k === i ? 'on' : '') + '">' + esc(s) + '</i>'; }).join('') + '</span>';
  }

  // ---------- 화면: 분석 리포트 ----------

    let h = '<h1>분석 리포트</h1><p class="lead">가상 중간보고의 정량분석을 한 화면에 모았습니다. 검색·정제 건수(가상 구축 기록)를 뺀 모든 수치는 기준선 ' + esc(state.currentBaseline) + ' 배열에서 계산합니다.</p>';
    h += '<div class="kpis kpis6">' + [
      ['관련 문헌', s.docs + '건', '4개국 · ' + s.yearMin + '~' + s.yearMax + '년 출원'], ['미국 문헌 비중', s.usPct + '%', '국가별 구성은 CARD-11'],
      ['기간만료 추정', s.expiredPct + '%', s.expired + '건 — 누구나 참고 가능한 구조'], ['서로 다른 출원인', s.applicants + '명', s.singlePct + '%는 1건만 보유'],
      ['Core 문헌', s.core + '건', 'C 테이블 ' + s.coreBy.C + ' · D 커넥터 ' + s.coreBy.D + ' · A·B ' + (s.coreBy.A + s.coreBy.B)], ['문헌당 결합방식', s.avgMechs + '개', '한 가지 방식만 쓰는 제품은 드묾']
    ].map(function (k) { return '<div class="kpi"><div class="k">' + esc(k[0]) + '</div><div class="v">' + esc(k[1]) + '</div><div class="small muted">' + esc(k[2]) + '</div></div>'; }).join('') + '</div>';
    h += '<h2>검색에서 분류까지</h2><div class="panel"><div class="pipe">' + [
      ['검색', searched, Object.keys(P.search).map(function (k) { return k + ' ' + P.search[k]; }).join(' · '), true],
      ['정제', refined, '중복·패밀리 통합, 관련성 1차 선별', true], ['관련 문헌', s.docs, '독립청구항 기준 판정 · 제외 ' + P.excluded + '건', false], ['Core', s.core, '개발 컨셉의 필수요건을 모두 갖춘 문헌', false]
    ].map(function (p) { return '<div class="pipe-step"><div class="pipe-bar" style="width:' + Math.max(8, Math.round(100 * p[1] / searched)) + '%"></div><div class="row"><b>' + esc(p[0]) + '</b><span class="pipe-n">' + p[1].toLocaleString() + '건</span>' + (p[3] ? '<span class="badge b-neutral">가상 구축 기록</span>' : '<span class="badge b-calc">배열에서 계산</span>') + '</div><div class="small muted">' + esc(p[2]) + '</div></div>'; }).join('') + '</div></div>';
    h += '<h2>시사점 여섯 가지</h2><div class="grid3">' + F.insights(state).map(function (x, i) {
      return '<div class="insight"><div class="no">' + (i + 1) + '</div><div class="big">' + esc(x.big) + '</div><div class="small muted">' + esc(x.label) + '</div><h3 style="margin-top:8px">' + esc(x.title) + '</h3><div class="small">' + esc(x.text) + '</div></div>';
    }).join('') + '</div><p class="small muted">시사점 문장은 계산된 수치를 끼워 넣는 고정 문장이며, 가상 데이터 기준입니다.</p>';

    }).join('') + '</div>';

  // ---------- 화면: 신규 IP 창출 ----------

  function viewIP() {
    const IP = D.IP, fde = state.role === 'fde';
    const benchDocs = D.DOCS.filter(function (d) { return d.key === 'bench' && curBase().docIds.indexOf(d.id) >= 0; });
    let h = '<h1>신규 IP 창출</h1><p class="lead">팔리는 구조를 벤치마킹해 약점을 찾고, 그 약점을 푸는 구조로 권리 후보를 만듭니다.</p>' +
      '<div class="note warn">가상 예시입니다. 특허성·상업성 평가는 설명용 가상값이며, 실제 시험·심사 결과나 변리사 의견이 아닙니다. 등록 가능성과 권리 귀속은 자동으로 확정하지 않습니다.</div>';
    h += '<div class="flow">' + [['1', '벤치마킹 대상 선정', IP.target.name], ['2', '4개국 시장·특허 조사', '같은 방식 제품과 살아 있는 권리 확인'], ['3', '권리 지형 판단', '등록 장벽이 어디에 있는가'], ['4', '약점 도출', IP.weaknesses.length + '가지 약점'], ['5', '개선안 제안', '개선 설계 ' + IP.options.length + '안 + 보강 기술 ' + IP.addons.length + '개']]
      .map(function (x) { return '<div class="flow-step"><span class="n">' + x[0] + '</span><b>' + esc(x[1]) + '</b><div class="small muted">' + esc(x[2]) + '</div></div>'; }).join('') + '</div>';
    h += '<h2>벤치마킹 대상과 권리 지형</h2><div class="grid2"><div class="panel"><h3>' + esc(IP.target.name) + '</h3><ul class="small" style="margin:6px 0 10px;padding-left:18px">' + IP.target.how.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<div class="sec-title">관련 가상 문헌</div><div class="row">' + benchDocs.map(function (d) { return docChip(d.id); }).join('') + '</div></div>' +
      '<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">' + IP.landscape.map(function (l) { return '<div class="kpi"><div class="k">' + esc(l[0]) + '</div><div class="v">' + esc(l[1]) + '</div><div class="small muted">' + esc(l[2]) + '</div></div>'; }).join('') + '</div></div>';
    h += '<div class="note">결론(가상): 만들 수는 있지만 지금 구조 그대로는 권리를 받기 어렵습니다. 남의 권리에 걸릴 위험이 낮은 대신, 약점을 푸는 새 구성을 더해야 우리 권리가 됩니다.</div>';
    h += '<h2>개선 설계 5안</h2><div class="tablewrap"><table><thead><tr><th>안</th><th>해결하는 약점</th><th>핵심 구조</th><th>특허성</th><th>상업성</th></tr></thead><tbody>' +
      IP.options.map(function (o) { return '<tr' + (o.pick ? ' class="hl"' : '') + '><td><b>' + esc(o.no + ' ' + o.name) + '</b>' + (o.pick ? ' <span class="badge b-info">기업 선호</span>' : '') + '</td><td>' + esc(o.weak) + '</td><td>' + esc(o.core) + '</td><td>' + lvlBadge(o.pat) + '</td><td>' + lvlBadge(o.com) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    // 특허성 × 상업성 3x3
    const cell = function (p, c) {
      return IP.options.filter(function (o) { return o.pat === p && o.com === c; }).map(function (o) { return '<span class="pchip opt' + (o.pick ? ' pick' : '') + '" title="' + esc(o.name) + '">' + esc(o.no) + '</span>'; })
        .concat(IP.addons.filter(function (a) { return a.pat === p && a.com === c; }).map(function (a) { return '<span class="pchip add' + (a.rec ? ' rec' : '') + '" title="' + esc(a.name) + '">' + esc(a.k) + '</span>'; })).join('');
    };
    h += '<h2>특허성 × 상업성 지도</h2><div class="panel"><div class="pgrid"><div class="axis-y">특허성 ↑</div>' + ['H', 'M', 'L'].map(function (p) {
      return '<div class="plabel">' + lvl(p) + '</div>' + ['L', 'M', 'H'].map(function (c) { return '<div class="pcell' + (p === 'H' && c === 'H' ? ' best' : '') + '">' + cell(p, c) + '</div>'; }).join('');

      '<p class="small muted">④ 원터치 레버는 상업성이 가장 높지만 “레버로 잠그는 클램프”는 공구 분야에서 오래 알려져 단독으로는 진보성 부정 위험이 큽니다(가상 판단). 그래서 특허성은 ④에 얹는 가구 전용 보강 기술로 확보합니다.</p></div>';

    }).join('') + '</div>';

  // ---------- CSV 내려받기 ----------
  function downloadCsv(runId) {
    const run = state.runs[runId];
    try {
      const blob = new Blob(['﻿' + F.csvForRun(run)], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'FDE_' + run.id + '_' + run.baseline + '.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast(run.id + ' CSV를 내려받았습니다.');
    } catch (e) { toast('CSV를 만들지 못했습니다: 이 브라우저에서 다운로드가 차단되었습니다.'); }
  }

  function askAndShow(q) {
    state.view = 'ask'; drawer = null;
    const m = F.ask(state, q);
    commit();
    if (m) {
      const last = document.querySelector('#thread > :last-child');
      if (last) last.scrollIntoView({ block: 'start' });
    }
  }

  // ---------- 이벤트 ----------
  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    let r;
    switch (act) {
      case 'nav': go(id); break;
      case 'role': setRole(id); toast(id === 'fde' ? '컨설턴트(FDE) 화면 — 시연용 전환이며 인증이 아닙니다' : '연구자 화면'); break;
      case 'task-select': state.activeTaskId = id; commit(); break;
      case 'quick-ask': askAndShow(el.getAttribute('data-q')); break;
      case 'clear-filter': F.clearCtxFilter(state, id); commit(); break;
      case 'save':
        r = F.saveRun(state, id);
        commit(r.ok ? r.saved.id + '로 저장했습니다. 저장 결과에서 볼 수 있습니다.' : r.reason); break;
      case 'csv': downloadCsv(id); break;
      case 'doc': drawer = { kind: 'doc', id: id }; render(); break;
      case 'card': drawer = { kind: 'card', id: id }; render(); break;
      case 'card-version': drawer.runId = id; render(); break;
      case 'close-drawer': drawer = null; render(); break;
      case 'rerun-card':
        r = F.rerunCard(state, id); if (r.ok) drawer.runId = r.run.id;
        commit(r.ok ? '새 실행 ' + r.run.id + '(' + r.run.baseline + ')를 만들었습니다. 당시 결과는 그대로 남습니다.' : r.reason); break;
      case 'request':
        r = F.requestReview(state, id); commit(r.ok ? r.request.id + ' 전문 검토를 요청했습니다.' : r.reason); break;
      case 'publish-answer':
        r = F.publishAnswer(state, id); commit(r.ok ? '가상 답변을 공개했습니다. 연구자 화면에 도착 표시가 됩니다.' : r.reason); break;
      case 'review-cand': F.reviewCandidate(state, id); commit(); break;
      case 'review-all': state.candidates.forEach(function (c) { F.reviewCandidate(state, c.docId); }); commit('후보 ' + state.candidates.length + '건을 모두 검토 완료로 표시했습니다.'); break;
      case 'publish-risk': r = F.publishRisk(state, id); commit(r.ok ? id + ' 가상 검토 의견을 공개했습니다.' : r.reason); break;
      case 'advance-ic': r = F.advanceCandidate(state, id); commit(r.ok ? r.candidate.id + ' → ' + r.candidate.status : r.reason); break;
      case 'publish-v2':
        r = F.publishBaseline(state); commit(r.ok ? 'V2 기준선을 공개했습니다. 과제 영향은 “확인 필요”로 표시됩니다.' : r.reason); break;
      case 'advance-impact': r = F.advanceImpact(state, id); commit(r.ok ? r.impact.id + ' → ' + r.impact.status : r.reason); break;
      case 'rerun':
        r = F.rerunSaved(state, id); commit(r.ok ? '새 실행 ' + r.run.id + '(' + r.run.baseline + ')로 재실행했습니다. 저장된 결과는 바뀌지 않았습니다.' : r.reason); break;
      case 'task-edit': editingTask = id; render(); { const ta = document.getElementById('p-' + id); if (ta) ta.focus(); } break;
      case 'task-cancel': editingTask = null; render(); break;
      case 'guide-open': state.guideOpen = true; commit(); break;
      case 'guide-close': state.guideOpen = false; commit(); break;
      case 'guide-next': state.guideStep = Math.min(GUIDE.length - 1, state.guideStep + 1); commit(); break;
      case 'guide-prev': state.guideStep = Math.max(0, state.guideStep - 1); commit(); break;
      case 'guide-go': GUIDE[state.guideStep].go(); break;
      case 'reset':
        if (window.confirm('시연을 처음 상태로 되돌릴까요? 저장 결과와 요청이 모두 지워집니다.')) {
          F.clearStorage(safeStorage());
          state = F.createInitialState(); drawer = null; editingTask = null; browse = { q: '', sub: '', type: '' };
          commit('처음 상태로 초기화했습니다.');
        }
        break;
    }
  });

  document.addEventListener('submit', function (e) {
    const f = e.target;
    if (f.id === 'ask-form') {
      e.preventDefault();
      const i = document.getElementById('ask-input');
      const q = i.value; if (!q.trim()) return;
      askAndShow(q);
      const ni = document.getElementById('ask-input'); if (ni) ni.focus();
    } else if (f.getAttribute('data-form') === 'task') {
      e.preventDefault();
      const id = f.getAttribute('data-id');
      const r = F.updateTask(state, id, { problem: f.problem.value, constraints: f.constraints.value, decisionDate: f.decisionDate.value });
      if (r.ok) editingTask = null;
      commit(r.ok ? '과제를 수정했습니다(연구자 수정으로 표시).' : r.reason);
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'browse-q') { browse.q = e.target.value; document.getElementById('browse-results').innerHTML = browseResults(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'browse-sub') { browse.sub = e.target.value; document.getElementById('browse-results').innerHTML = browseResults(); }
    if (e.target.id === 'browse-type') { browse.type = e.target.value; document.getElementById('browse-results').innerHTML = browseResults(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && drawer) { drawer = null; render(); }
  });

  // ---------- 차트 툴팁 (textContent로만 넣음) ----------
  function showTip(el, x, y) {
    const tip = document.getElementById('viz-tip');
    tip.textContent = '';
    const b = document.createElement('b'); b.textContent = el.getAttribute('data-tip-v');
    const sp = document.createElement('span'); sp.textContent = el.getAttribute('data-tip-l');
    tip.appendChild(b); tip.appendChild(sp);
    if (x == null) { const r = el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
    tip.style.left = Math.max(70, Math.min(window.innerWidth - 70, x)) + 'px'; tip.style.top = y + 'px';
    tip.hidden = false;
  }
  function hideTip() { const tip = document.getElementById('viz-tip'); if (tip) tip.hidden = true; }
  document.addEventListener('pointermove', function (e) {
    const el = e.target.closest && e.target.closest('[data-tip-v]');
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener('focusin', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-tip-v')) showTip(e.target); else hideTip(); });
  document.addEventListener('scroll', hideTip, true);

  window.__FDE_UI = { getState: function () { return state; } };
  commit();
})();
</script>
</body>
</html>
