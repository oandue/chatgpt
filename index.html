<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE 가상 데이터 시연</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5fb; --panel:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e3e8f2; --line-2:#eef1f7;
  --accent:#4f46e5; --accent-2:#2a78d6; --accent-soft:#eef0ff;
  --grad-brand:linear-gradient(135deg,#6366f1 0%,#2a78d6 55%,#22c1c3 100%);
  --grad-hero:radial-gradient(1200px 400px at 0% 0%,rgba(99,102,241,.55),transparent 60%),radial-gradient(900px 380px at 100% 0%,rgba(34,193,195,.45),transparent 60%),linear-gradient(135deg,#131a3a 0%,#1b2554 50%,#15325e 100%);
  --warn:#9a5b00; --warn-soft:#fff6e6; --ok:#0f7a4a; --ok-soft:#e7f7ef;
  --risk:#b4233a; --risk-soft:#fdecef; --violet:#6d3fd1; --violet-soft:#f3edff;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(30,41,90,.18);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 24px 48px -16px rgba(30,41,90,.30);
  --nav-bg:#0d1330; --nav-ink:#aeb8d6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 260px at 20% -40px,rgba(99,102,241,.12),transparent 70%),radial-gradient(600px 240px at 90% -60px,rgba(34,193,195,.12),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid rgba(99,102,241,.45);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(227,232,242,.9)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px;margin-right:auto;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 6px 16px -6px rgba(79,70,229,.7),inset 0 1px 0 rgba(255,255,255,.35);flex:none}
.baseline-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:5px 14px 5px 10px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm)}
.baseline-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.role-switch{display:inline-flex;background:#eef1f7;border-radius:11px;padding:3px;gap:2px}
.role-switch button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;border-radius:8px;color:var(--muted);transition:all .2s}
.role-switch button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.demo-banner{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 20px;color:#8a5a00;background:linear-gradient(90deg,#fff7e8,#fffaf1 60%,rgba(255,250,241,0));border-top:1px solid #f6e6c6}
.demo-banner::before{content:"DEMO";font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);padding:1px 7px;border-radius:5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .2s,border-color .2s,background .2s}
.btn:hover{border-color:#c7d0e3;box-shadow:var(--shadow);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px rgba(79,70,229,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 10px 22px -10px rgba(79,70,229,.9)}
.btn.small{padding:5px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* 레이아웃 */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - var(--head-h,98px))}
nav.side{background:var(--nav-bg);background-image:radial-gradient(240px 200px at 0% 0%,rgba(99,102,241,.35),transparent 70%),radial-gradient(260px 220px at 100% 100%,rgba(34,193,195,.18),transparent 70%);padding:18px 12px;position:sticky;top:var(--head-h,98px);align-self:start;height:calc(100vh - var(--head-h,98px));overflow-y:auto}
nav.side .nav-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#6b769b;padding:4px 12px 8px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--nav-ink);padding:10px 12px;border-radius:11px;margin-bottom:3px;font-weight:500;font-size:14.5px;transition:background .2s,color .2s}
nav.side button svg{width:18px;height:18px;flex:none;opacity:.85}
nav.side button .lbl{flex:1}
nav.side button:hover{background:rgba(255,255,255,.06);color:#fff}
nav.side button[aria-current="page"]{background:linear-gradient(135deg,rgba(99,102,241,.95),rgba(42,120,214,.95));color:#fff;font-weight:600;box-shadow:0 8px 20px -10px rgba(99,102,241,.9),inset 0 1px 0 rgba(255,255,255,.18)}
nav.side .fde-only{margin-top:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.count{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;min-width:20px;line-height:20px;text-align:center;box-shadow:0 2px 8px -2px rgba(225,29,72,.6)}
main{padding:28px 32px 140px;max-width:1180px;width:100%}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.03em;font-weight:800}
h2{font-size:16px;margin:30px 0 12px;letter-spacing:-.02em;font-weight:700;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--grad-brand)}
h3{font-size:15px;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.note{background:#f7f9fc;border:1px solid var(--line-2);border-left:3px solid #b6c2d9;padding:10px 14px;font-size:13.5px;color:var(--ink-2);border-radius:10px;margin:8px 0}
.note.warn{background:var(--warn-soft);border-color:#f7e3bd;border-left-color:#f59e0b;color:#7a4b00}
.note.risk{background:var(--risk-soft);border-color:#f6cfd6;border-left-color:#e11d48;color:var(--risk)}
.note.ok{background:var(--ok-soft);border-color:#c9ecd9;border-left-color:#10b981;color:var(--ok)}

/* 히어로 */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;color:#e7ebff;background:var(--grad-hero);box-shadow:var(--shadow-lg);margin-bottom:18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:#9fb0ff;text-transform:uppercase}
.hero h1{color:#fff;font-size:28px;margin:6px 0 6px}
.hero p{color:#c3cbeb;margin:0;max-width:640px}
.hero .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px}
.hero .tabs button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#dfe5ff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;transition:all .2s}
.hero .tabs button:hover{background:rgba(255,255,255,.12)}
.hero .tabs button[aria-pressed="true"]{background:#fff;color:#1b2554;border-color:#fff}
.hero-task{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 18px;backdrop-filter:blur(6px)}
.hero-task h3{color:#fff;font-size:17px;margin:0}
.hero-task .meta{color:#aeb9e3;font-size:13px}
.hero-task .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:#aab6e0;font-weight:600}
.stat .v{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.2}
.stat .v small{font-size:13px;font-weight:600;color:#aab6e0;margin-left:3px}

/* 배지 */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-calc{background:var(--ok-soft);color:var(--ok);border-color:#cdeedb}
.b-explain{background:var(--violet-soft);color:var(--violet);border-color:#e3d8fb}
.b-review{background:var(--risk-soft);color:var(--risk);border-color:#f6d0d7}
.b-pending{background:var(--warn-soft);color:#8a5a00;border-color:#f6e2b8}
.b-neutral{background:#f1f4f9;color:var(--ink-2);border-color:#e3e8f2}
.b-neutral::before{display:none}
.b-info{background:var(--accent-soft);color:var(--accent);border-color:#dcdcfd}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--shadow-sm)}
.chip button{border:0;background:#eef1f7;border-radius:50%;width:16px;height:16px;line-height:14px;padding:0;margin-left:2px;color:var(--muted);font-size:12px}
.chip button:hover{background:#fde2e7;color:var(--risk)}
.doc-chip{white-space:nowrap;border:1px solid #dcdffb;background:linear-gradient(180deg,#fff,#f4f5ff);color:#3f3aa8;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;transition:all .15s}
.doc-chip:hover{border-color:#a5a8f5;box-shadow:0 4px 12px -6px rgba(79,70,229,.6);transform:translateY(-1px)}

/* 카드 목록 */
.card-item{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 16px 20px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.card-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-brand);opacity:.85}
.card-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#d3d9f5}
.card-item .q{font-weight:700;font-size:15.5px;margin:6px 0 2px;letter-spacing:-.015em;color:var(--ink)}

/* 물어보기 */
.condbar{position:sticky;top:var(--head-h,98px);z-index:5;background:rgba(243,245,251,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 0;margin:0 -4px;padding-left:4px}
.thread{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.msg-user{align-self:flex-end;background:var(--grad-brand);color:#fff;border-radius:18px 18px 4px 18px;padding:9px 16px;max-width:80%;font-weight:500;box-shadow:0 8px 20px -10px rgba(79,70,229,.8)}
.msg-bot{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.sec{margin-top:14px}
.sec-title{font-size:11.5px;font-weight:800;color:#8792ab;letter-spacing:.08em;margin-bottom:6px}
.askbox{position:sticky;bottom:0;padding:16px 0 10px;background:linear-gradient(180deg,rgba(243,245,251,0),var(--bg) 30%)}
.askbox form{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow-lg)}
.askbox input{flex:1;border:0;outline:none;border-radius:10px;padding:10px 12px;background:transparent;font-size:15px}
.askbox form:focus-within{border-color:#b9bdf7;box-shadow:0 0 0 4px rgba(99,102,241,.12),var(--shadow-lg)}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.examples button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2);transition:all .15s}
.examples button:hover{border-color:#b9bdf7;color:var(--accent);background:#f7f7ff}

/* 표 */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line-2);padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:#f7f9fc;font-weight:700;color:var(--ink-2);font-size:12.5px;border-bottom:1px solid var(--line)}
thead th:first-child{border-top-left-radius:10px}
thead th:last-child{border-top-right-radius:10px}
tbody tr{transition:background .15s}
tbody tr:hover{background:#fafbff}
tfoot th{background:#f7f9fc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tablewrap table th,.tablewrap table td{border-bottom-color:var(--line-2)}
.tablewrap tbody tr:last-child td{border-bottom:0}

/* 차트 */
.chart-card{background:linear-gradient(180deg,#fbfcff,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 12px 6px;margin-bottom:12px;position:relative}
.chart-head{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);padding:0 6px 6px}
.chart-head .key{display:inline-block;width:10px;height:10px;border-radius:3px;background:linear-gradient(180deg,#7cc4ff,#2a78d6)}
.chart{width:100%;max-width:720px;height:auto;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-family:inherit}
.chart .val{fill:var(--ink);font-weight:700;font-size:11.5px}
.chart .grid{stroke:#e8ecf5;stroke-dasharray:3 4}
.chart .axis{stroke:#cfd6e4}
.chart .bar{cursor:pointer;outline:none;transition:filter .15s}
.chart .bar-g{outline:none}
.chart .bar-g:hover .bar,.chart .bar-g:focus .bar{filter:brightness(1.12) drop-shadow(0 6px 10px rgba(42,120,214,.35))}
.chart .bar.zero{fill:#e3e8f2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .lab{fill:var(--ink-2);font-size:12.5px}
.drawer .chart text{font-size:14px}
.drawer .chart .lab{font-size:15px}
.drawer .chart .val{font-size:14px}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.thread > .msg-bot:last-child .chart .bar,.drawer .chart .bar{transform-box:fill-box;animation:grow-y .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
.thread > .msg-bot:last-child .chart.h .bar,.drawer .chart.h .bar{animation-name:grow-x;transform-origin:0 50%}
@media (prefers-reduced-motion:reduce){.chart .bar{animation:none!important}}
.viz-tip{position:fixed;z-index:60;pointer-events:none;background:rgba(15,23,42,.94);color:#fff;border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}
.viz-tip b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.viz-tip span{color:#b7c2dd}
/* 히트맵 */
.heat td.mcell{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid #fff;border-radius:10px;padding:12px 6px;transition:transform .15s}
.heat td.mcell:hover{transform:scale(1.04)}
.heat td.mcell.zero{background:repeating-linear-gradient(135deg,#fff7e8 0 6px,#fff1d6 6px 12px);color:#a15c00;outline:1.5px dashed #f0b35a;outline-offset:-4px}
.heat{border-collapse:separate;border-spacing:4px}
.heat td.mcell{width:19%}
.heat th{white-space:nowrap;background:none;border:0;font-size:12.5px;color:var(--ink-2)}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.heat-legend .ramp{width:140px;height:8px;border-radius:99px;background:linear-gradient(90deg,#cde2fb,#6da7ec,#2a78d6,#184f95)}
.diff-up{color:var(--ok);font-weight:700}
.diff-down{color:var(--risk);font-weight:700}

/* 서랍 */
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,35,.42);backdrop-filter:blur(3px);z-index:40;animation:fade .2s both}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(600px,calc(100% - 20px));background:#fff;z-index:41;overflow-y:auto;padding:22px 24px 40px;border-radius:20px;box-shadow:0 30px 80px -20px rgba(10,15,35,.45);animation:slide .28s cubic-bezier(.2,.8,.2,1) both;outline:none}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer .close{position:sticky;top:0;float:right;z-index:2}
.quote{background:linear-gradient(180deg,#fdfcf8,#faf7ee);border:1px solid #efe7d2;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:8px 0;color:#4a4330}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:10px 0;font-size:13.5px}
dl.kv dt{color:var(--muted);font-weight:600}
dl.kv dd{margin:0}

/* 가이드 */
.guide{position:fixed;right:20px;bottom:20px;z-index:30;width:min(390px,calc(100% - 32px));background:var(--grad-hero);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 24px 60px -16px rgba(10,15,40,.6);border:1px solid rgba(255,255,255,.1)}
.guide h3{color:#fff;font-size:17px;margin-top:4px}
.guide p{margin:6px 0 12px;font-size:13.5px;color:#cdd5f3}
.guide .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2);box-shadow:none}
.guide .btn.primary{background:#fff;color:#1b2554;border-color:#fff}
.guide .steps{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#9fb0ff}
.guide .pips{display:flex;gap:4px;margin-top:6px}
.guide .pips i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
.guide .pips i.on{background:linear-gradient(90deg,#8b8ff8,#5ee7df)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;background:rgba(15,23,42,.94);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:fade .2s both}
textarea,input[type=text],input[type=date],select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
textarea:focus,input[type=text]:focus,input[type=date]:focus,select:focus{outline:none;border-color:#a5a8f5;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,#fbfcff,#fff);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em}


/* 분석 리포트 · 신규 IP */
.kpis6{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .v{line-height:1.25}
.pipe{display:flex;flex-direction:column;gap:12px}
.pipe-step{position:relative}
.pipe-bar{height:10px;border-radius:99px;background:linear-gradient(90deg,#1c5cab,#2a78d6 60%,#86b6ef);margin-bottom:6px}
.pipe-n{font-weight:800;font-size:17px;letter-spacing:-.02em}
.insight{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.insight .no{position:absolute;right:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--grad-brand);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.insight .big{font-size:30px;font-weight:800;letter-spacing:-.03em;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel.mini .q{display:block;text-align:left;margin:6px 0 10px;font-size:15px;color:var(--ink);text-decoration:none}
.panel.mini .q:hover{color:var(--accent)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.flow-step{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm);position:relative}
.flow-step .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grad-brand);color:#fff;font-size:12px;font-weight:800;margin-right:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.addon{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.addon.rec{border-color:#b9bdf7;box-shadow:0 0 0 3px rgba(99,102,241,.12),var(--shadow)}
.ak{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--grad-brand);color:#fff;font-weight:800;font-size:13px}
.ak.sm{min-width:20px;height:20px;font-size:11px;border-radius:6px}
tr.hl td{background:#f5f6ff}
.pgrid{display:grid;grid-template-columns:28px 56px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch;position:relative}
.pgrid .axis-y{grid-row:1/4;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.pgrid .plabel{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center}
.pgrid .plabel.x{padding-top:2px}
.pgrid .axis-x{grid-column:3/6;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.pcell{min-height:64px;border-radius:12px;background:#f5f7fc;border:1px solid var(--line-2);display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:center;padding:8px}
.pcell.best{background:linear-gradient(135deg,#eef0ff,#e6f6ff);border-color:#c9d2f7}
.pchip{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;font-weight:800;font-size:13px;background:#fff;border:2px solid #2a78d6;color:#1c5cab}
.pchip.add{border-radius:8px;border-color:#94a3b8;color:var(--ink-2)}
.pchip.add.rec{background:var(--grad-brand);border-color:transparent;color:#fff}
.pchip.opt.pick{background:#2a78d6;color:#fff}
.lkey{display:inline-block;width:14px;height:3px;border-radius:2px;margin:0 4px 2px 8px;vertical-align:middle}
ol.claim{margin:4px 0 8px;padding-left:22px}
ol.claim li{margin:3px 0}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;margin:0 4px 3px 0;border:1px solid}
.tag.k{background:#eef4fe;border-color:#cfe0fa;color:#1c5cab}
.tag.p{background:#f3f0fe;border-color:#e0d8fb;color:#5b3fb5}
.tag.u{background:#ecf8f2;border-color:#cdeedb;color:#0f7a4a}
.flow-pills{display:inline-flex;flex-wrap:wrap;gap:4px}
.flow-pills i{font-style:normal;font-size:11.5px;padding:2px 9px;border-radius:999px;background:#eef1f7;color:var(--muted);font-weight:600}
.flow-pills i.done{background:#e1ecfb;color:#1c5cab}
.flow-pills i.on{background:var(--grad-brand);color:#fff}
details.riskrow{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:#fff}
details.riskrow summary{cursor:pointer;list-style:none}
details.riskrow summary::-webkit-details-marker{display:none}
details.riskrow table{margin-top:8px}
@media (max-width:820px){.kpis6,.grid4{grid-template-columns:minmax(0,1fr)}.panel,.insight,.addon{min-width:0}.pgrid{grid-template-columns:20px 40px repeat(3,minmax(0,1fr))}}

@media (max-width:820px){
  header.top{position:static}
  .layout{grid-template-columns:1fr}
  nav.side{display:flex;overflow-x:auto;gap:4px;padding:8px;position:sticky;top:0;z-index:15;height:auto;align-self:auto}
  nav.side .nav-label{display:none}
  nav.side button{width:auto;white-space:nowrap;margin:0;padding:8px 12px}
  nav.side .fde-only{margin:0;border:0;padding:0;display:flex}
  main{padding:18px 16px 150px}
  .grid2,.grid3,.kpis{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .condbar{position:static}
  .brand{width:100%}
  .hero{padding:20px}
  .drawer{top:0;right:0;bottom:0;width:100%;border-radius:0}
  dl.kv{grid-template-columns:96px 1fr}
}
</style>
</head>

<script id="fde-core">
(function (global) {
  'use strict';
  const D = global.FDE_DATA;
  const SCHEMA = 4;
  const DOC_BY_ID = {};
  D.DOCS.forEach(function (d) { DOC_BY_ID[d.id] = d; });

  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function nowIso() { return new Date().toISOString(); }
  function today() { return nowIso().slice(0, 10); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getDoc(id) { return DOC_BY_ID[id] || null; }
  function isAlive(d) { return d.status === '존속' || d.status === '공개·심사중'; }

  // ---------- 기준선 ----------
  function baselineOf(state, id) { return state.baselines.find(function (b) { return b.id === id; }) || null; }
  function docsInBaseline(state, baselineId) {
    const b = baselineOf(state, baselineId || state.currentBaseline);
    if (!b) return [];
    return b.docIds.map(getDoc).filter(Boolean);
  }
  function uniqueFamilies(docs) {
    const s = new Set(); docs.forEach(function (d) { s.add(d.familyId); }); return s.size;
  }
  function candidateDocs(state) { return state.candidates.map(function (c) { return getDoc(c.docId); }); }

  // ---------- 구간 ----------
  const PERIODS = [['~1979', 0, 1979], ['1980–84', 1980, 1984], ['1985–89', 1985, 1989], ['1990–94', 1990, 1994], ['1995–99', 1995, 1999],
    ['2000–04', 2000, 2004], ['2005–09', 2005, 2009], ['2010–14', 2010, 2014], ['2015–19', 2015, 2019], ['2020–24', 2020, 2024], ['2025–26', 2025, 2026]];
  const ERAS = [['~1999', 0, 1999], ['2000–09', 2000, 2009], ['2010–19', 2010, 2019], ['2020–26', 2020, 2026]];
  function bucketOf(list, y) { const b = list.find(function (p) { return y >= p[1] && y <= p[2]; }); return b ? b[0] : null; }

  // ---------- 필터·집계 ----------
  function matchFilters(d, f) {
    f = f || {};
    if (f.country === 'KR' && d.country !== 'KR') return false;
    if (f.country === 'FOREIGN' && d.country === 'KR') return false;
    if (f.sub && d.sub !== f.sub) return false;
    if (f.mech && d.mechs.indexOf(f.mech) < 0) return false;
    if (f.rights && d.rights !== f.rights) return false;
    if (f.rel && d.rel !== f.rel) return false;
    if (f.status === 'alive' && !isAlive(d)) return false;
    if (f.status === 'expired' && d.status !== '만료 추정') return false;
    return true;
  }

  // 한 문헌이 여러 값을 가질 수 있다(결합방식). 항상 배열로 돌려준다.
  function groupValues(d, groupBy) {
    if (groupBy === 'period') return [bucketOf(PERIODS, d.year)];
    if (groupBy === 'year') return [d.year];
    if (groupBy === 'mech') return d.mechs;
    if (groupBy === 'sub') return [d.sub];
    if (groupBy === 'applicant') return [d.applicant];
    if (groupBy === 'country') return [d.country];
    if (groupBy === 'status') return [d.status];
    if (groupBy === 'rel') return [d.rel];
    if (groupBy === 'expiry') return [d.expiryYear];
    return [];
  }

  function groupKeys(groupBy, scopeDocs) {
    if (groupBy === 'period') return PERIODS.map(function (p) { return p[0]; });
    if (groupBy === 'mech') return D.MECHS.slice();
    if (groupBy === 'sub') return Object.keys(D.SUBS);
    if (groupBy === 'country') return Object.keys(D.COUNTRIES);
    if (groupBy === 'status') return D.STATUSES.slice();
    if (groupBy === 'rel') return ['Core', 'Adjacent'];
    if (groupBy === 'expiry') {
      if (!scopeDocs.length) return [];
      const ys = scopeDocs.map(function (d) { return d.expiryYear; });
      const out = []; for (let y = Math.max(D.TODAY_YEAR, Math.min.apply(null, ys)); y <= Math.max.apply(null, ys); y++) out.push(y);
      return out;
    }
    if (groupBy === 'applicant') {
      const counts = {};
      scopeDocs.forEach(function (d) { counts[d.applicant] = (counts[d.applicant] || 0) + 1; });
      return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); }).slice(0, 10);
    }
    return [];
  }

  function keyLabel(groupBy, k) {
    if (groupBy === 'year' || groupBy === 'expiry') return k + '년';
    if (groupBy === 'sub') return D.SUBS[k] || k;
    if (groupBy === 'country') return D.COUNTRIES[k] || k;
    return String(k);
  }

  function countOf(docs, unit) { return unit === 'family' ? uniqueFamilies(docs) : docs.length; }
  function ids(docs) { return docs.map(function (d) { return d.id; }); }

  // 순수 함수: 문헌 배열 + 조건 → 결과. 수치는 오직 여기서 나온다.
  function aggregate(baselineDocs, spec) {
    const scope = baselineDocs.filter(function (d) { return matchFilters(d, spec.filters); });
    const result = { totals: { docs: scope.length, families: uniqueFamilies(scope) }, docIds: ids(scope), rows: [], matrix: null, series: null, rowSum: null };
    if (spec.groupBy === 'matrix') {
      const rows = D.MECHS.slice(), cols = Object.keys(D.SUBS);
      result.matrix = { rows: rows, cols: cols, cells: {} };
      rows.forEach(function (m) {
        cols.forEach(function (s) {
          const ds = scope.filter(function (d) { return d.sub === s && d.mechs.indexOf(m) >= 0; });
          result.matrix.cells[m + '|' + s] = { count: countOf(ds, spec.unit), docIds: ids(ds) };
        });
      });
      return result;
    }
    if (spec.groupBy === 'funnel') {
      const s1 = scope.filter(function (d) { return d.country !== 'KR'; });
      const s2 = s1.filter(isAlive);
      const s3 = s2.filter(function (d) { return d.krFamily; });
      result.rows = [['foreign', '해외 문헌 (미국·유럽·일본)', s1], ['alive', '그중 권리 존속·공개 중', s2], ['krfam', '그중 한국 가족특허 보유', s3]]
        .map(function (x) { return { key: x[0], label: x[1], count: countOf(x[2], spec.unit), docIds: ids(x[2]) }; });
      return result;
    }
    if (spec.groupBy === 'share') {
      result.series = {};
      result.rows = ERAS.map(function (e) {
        const ds = scope.filter(function (d) { return d.year >= e[1] && d.year <= e[2]; });
        return { key: e[0], label: e[0], count: countOf(ds, spec.unit), docIds: ids(ds) };
      });
      D.MECHS.forEach(function (m) {
        result.series[m] = result.rows.map(function (r) {
          const ds = r.docIds.map(getDoc);
          const withM = ds.filter(function (d) { return d.mechs.indexOf(m) >= 0; });
          return spec.unit === 'family' ? pct(uniqueFamilies(withM), uniqueFamilies(ds)) : pct(withM.length, ds.length);
        });
      });
      return result;
    }
    const keys = groupKeys(spec.groupBy, scope);
    result.rows = keys.map(function (k) {
      const ds = scope.filter(function (d) { return groupValues(d, spec.groupBy).indexOf(k) >= 0; });
      return { key: k, label: keyLabel(spec.groupBy, k), count: countOf(ds, spec.unit), docIds: ids(ds) };
    });
    result.rowSum = result.rows.reduce(function (a, r) { return a + r.count; }, 0);
    if (spec.groupBy === 'applicant') {
      const counts = {};
      scope.forEach(function (d) { counts[d.applicant] = (counts[d.applicant] || 0) + 1; });
      const vals = Object.keys(counts).map(function (k) { return counts[k]; });
      result.totals.applicants = { distinct: vals.length, single: vals.filter(function (v) { return v === 1; }).length, max: vals.length ? Math.max.apply(null, vals) : 0 };
    }
    return result;
  }

  const FILTER_KEYS = ['country', 'sub', 'mech', 'rights', 'rel', 'status'];
  function normalizeSpec(spec) {
    const f = spec.filters || {};
    const filters = {};
    FILTER_KEYS.forEach(function (k) { if (f[k]) filters[k] = f[k]; });
    return { groupBy: spec.groupBy || 'period', unit: spec.unit === 'family' ? 'family' : 'doc', filters: filters };
  }

  function deepFreeze(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
      Object.freeze(o); Object.keys(o).forEach(function (k) { deepFreeze(o[k]); });
    }
    return o;
  }

  // 분석 실행: 실행 번호·기준선·조건·문헌·수치를 함께 고정해 기록한다.
  function runAnalysis(state, spec, origin) {
    const s = normalizeSpec(spec);
    const baseline = state.currentBaseline;
    const res = aggregate(docsInBaseline(state, baseline), s);
    state.runSeq += 1;
    const run = {
      id: 'RUN-' + pad(state.runSeq, 4), baseline: baseline, spec: s, createdAt: nowIso(), origin: origin || '질문', engine: 'fde-core/' + SCHEMA,
      totals: res.totals, docIds: res.docIds, rows: res.rows, rowSum: res.rowSum, matrix: res.matrix, series: res.series
    };
    state.runs[run.id] = deepFreeze(clone(run));
    return state.runs[run.id];
  }

  const GROUP_LABEL = { period: '5년 단위 출원', year: '출원연도별', mech: '결합방식별', sub: '제품군(기술축)별', applicant: '출원인별(상위 10)', country: '국가별',
    status: '권리 상태별', rel: '관련도별', expiry: '만료 예정 연도별', matrix: '결합방식 × 제품군', funnel: '해외 특허의 국내 영향', share: '시기별 결합방식 비중' };
  const FILTER_LABEL = {
    country: function (v) { return '국가: ' + (v === 'KR' ? '국내(한국)만' : '해외만'); },
    sub: function (v) { return '제품군: ' + D.SUBS[v]; },
    mech: function (v) { return '결합방식: ' + v; },
    rights: function (v) { return '권리검토 필요도: ' + D.LEVELS[v]; },
    rel: function (v) { return '관련도: ' + v + '만'; },
    status: function (v) { return '권리: ' + (v === 'alive' ? '존속·공개 중' : '만료 추정'); }
  };

  function specChips(spec) {
    const out = [GROUP_LABEL[spec.groupBy] || spec.groupBy, '집계 단위: ' + (spec.unit === 'family' ? '패밀리' : '문헌')];
    Object.keys(spec.filters).forEach(function (k) { out.push(FILTER_LABEL[k](spec.filters[k])); });
    if (!Object.keys(spec.filters).length) out.push('필터 없음(전체)');
    return out;
  }
  function filterChip(k, v) { return FILTER_LABEL[k](v); }

  function unitWord(spec) { return spec.unit === 'family' ? '개 패밀리' : '건'; }

  // 결과 설명: 계산된 수치를 그대로 읽어 문장으로 만든다(새 수치를 만들지 않음).
  function describeRun(run) {
    const u = unitWord(run.spec);
    const lines = ['기준선 ' + run.baseline + ' · 조건에 포함된 문헌 ' + run.totals.docs + '건(고유 패밀리 ' + run.totals.families + '개).'];
    const g = run.spec.groupBy;
    if (g === 'matrix') {
      const zero = [], low = [];
      Object.keys(run.matrix.cells).forEach(function (k) {
        const c = run.matrix.cells[k].count; const p = k.split('|');
        const name = p[0] + ' × ' + D.SUB_SHORT[p[1]];
        if (c === 0) zero.push(name); else if (c <= 2) low.push(name + '(' + c + ')');
      });
      lines.push(zero.length ? '관측되지 않은 조합: ' + zero.join(', ') + '.' : '관측되지 않은 조합은 없습니다.');
      if (low.length) lines.push('2' + u + ' 이하로 적게 관측된 조합: ' + low.join(', ') + '.');
      lines.push('적게 관측된 조합은 연구 후보(가설)일 뿐이며, 신규성·등록 가능성을 뜻하지 않습니다.');
      return lines;
    }
    if (run.totals.docs === 0) { lines.push('조건에 맞는 문헌이 없습니다.'); return lines; }
    if (g === 'funnel') {
      const r = run.rows;
      lines.push(r[0].label + ' ' + r[0].count + u + ' → ' + r[1].label.replace('그중 ', '') + ' ' + r[1].count + u + ' → ' + r[2].label.replace('그중 ', '') + ' ' + r[2].count + u + '.');
      if (r[1].count) lines.push('해외 존속·공개 문헌의 ' + (100 - pct(r[2].count, r[1].count)) + '%는 이 데이터에서 한국 가족특허가 확인되지 않습니다. 특허는 나라별로 효력이 있으므로 국내 효력은 한국 등록 여부로 따로 확인해야 합니다.');
      lines.push('모양을 따라 하는 경우 디자인권은 별도 확인 대상입니다.');
      return lines;
    }
    if (g === 'share') {
      const f = run.series['형상맞물림'], m = run.series['자석'];
      lines.push('형상맞물림 비중 ' + f[0] + '% → ' + f[f.length - 1] + '%, 자석 비중 ' + m[0] + '% → ' + m[m.length - 1] + '% (' + run.rows[0].label + ' → ' + run.rows[run.rows.length - 1].label + ').');
      lines.push('비중은 각 시기 문헌 중 해당 방식을 쓰는 문헌의 비율이며, 한 문헌이 여러 방식을 쓰므로 합이 100%를 넘습니다.');
      return lines;
    }
    if (g === 'period') {
      const nz = run.rows.filter(function (r) { return r.count; });
      const max = run.rows.reduce(function (a, r) { return r.count > a.count ? r : a; }, run.rows[0]);
      lines.push('가장 많은 구간은 ' + max.label + '(' + max.count + u + ')입니다. 관측 구간 ' + nz[0].label + ' ~ ' + nz[nz.length - 1].label + '.');
      if (run.spec.unit === 'family' && run.rowSum !== run.totals.families) lines.push('구간별 패밀리 수의 합(' + run.rowSum + ')은 전체 고유 패밀리 수(' + run.totals.families + ')와 다릅니다. 한 패밀리가 여러 구간에 걸치면 각 구간에서 셉니다.');
      lines.push('출원연도 기준이므로 최근 구간은 아직 공개되지 않은 출원이 빠져 있을 수 있습니다.');
      return lines;
    }
    if (g === 'expiry') {
      const by2030 = run.rows.filter(function (r) { return r.key <= 2030; }).reduce(function (a, r) { return a + r.count; }, 0);
      lines.push('2030년까지 만료 예정 ' + by2030 + u + '. 만료 연도는 출원일 + 법정 존속기간으로 계산한 추정치입니다.');
      lines.push('연차료 미납으로 더 일찍 소멸한 권리가 있을 수 있어, 실제 사용 전 등록원부 확인이 필요합니다.');
      return lines;
    }
    if (g === 'applicant') {
      const a = run.totals.applicants;
      lines.push('서로 다른 출원인 ' + a.distinct + '명 중 1건만 보유한 출원인 ' + pct(a.single, a.distinct) + '%, 최다 보유 ' + a.max + '건.');
      return lines;
    }
    if (g === 'status') {
      const ex = run.rows.find(function (r) { return r.key === '만료 추정'; });
      lines.push('만료 추정 ' + ex.count + u + '(' + pct(ex.count, run.spec.unit === 'family' ? run.totals.families : run.totals.docs) + '%) — 만료된 구조는 누구나 참고·적용할 수 있으나, 개량 부분은 새 권리를 확인해야 합니다.');
    }
    const sorted = run.rows.slice().sort(function (a, b) { return b.count - a.count; });
    const nz = sorted.filter(function (r) { return r.count > 0; });
    if (nz.length) lines.push('가장 많은 것은 ' + nz.slice(0, 2).map(function (r) { return r.label + '(' + r.count + u + ')'; }).join(', 다음은 ') + '입니다.');
    const zeros = run.rows.filter(function (r) { return r.count === 0; });
    if (zeros.length) lines.push(zeros.map(function (r) { return r.label; }).join(', ') + ': 0' + u + ' — 이 가상 배열에서 관측되지 않았다는 뜻입니다.');
    if (g === 'mech') {
      const mag = run.docIds.map(getDoc).filter(function (d) { return d.mechs.indexOf('자석') >= 0; }).length;
      lines.push('자석이 들어간 문헌 ' + mag + '건(' + pct(mag, run.totals.docs) + '%), 자석 없이 결합하는 문헌 ' + (run.totals.docs - mag) + '건. 한 문헌이 여러 방식을 쓰므로 항목 합(' + run.rowSum + ')은 중복 포함입니다.');
    } else if (run.spec.unit === 'family' && run.rowSum !== run.totals.families) {
      lines.push('항목별 패밀리 수의 합(' + run.rowSum + ')과 전체 고유 패밀리 수(' + run.totals.families + ')는 다를 수 있습니다.');
    }
    return lines;
  }

  const MECH_EXPLAIN = {
    '형상맞물림': '돌기와 홈이 맞물려 하중을 받는 방식 — 가장 흔한 주류(가상 문헌 서술 요약).',
    '스냅·래치': '탄성 부재가 딸깍 걸려 잠기는 방식(가상 문헌 서술 요약).',
    '슬라이드·키홀': '안내홈을 따라 밀어 넣어 잠그는 방식(가상 문헌 서술 요약).',
    '회전·캠': '캠을 돌려 결합면을 조이는 방식(가상 문헌 서술 요약).',
    '클램프·쐐기': '판재를 위아래에서 눌러 잡는 방식(가상 문헌 서술 요약).',
    '힌지·접이': '힌지로 펼치고 접는 방식(가상 문헌 서술 요약).',
    '자석': '자력으로 위치를 맞추고 붙잡는 방식 — 하중보다 정렬 역할에 적합(가상 문헌 서술 요약).'
  };

  // ---------- 질문 분기 ----------
  const DEFAULT_SPEC = { groupBy: 'period', unit: 'doc', filters: {} };
  const MECH_WORDS = [['자석', '자석'], ['형상', '형상맞물림'], ['끼움', '형상맞물림'], ['스냅', '스냅·래치'], ['래치', '스냅·래치'], ['슬라이드', '슬라이드·키홀'],
    ['키홀', '슬라이드·키홀'], ['캠', '회전·캠'], ['클램프', '클램프·쐐기'], ['쐐기', '클램프·쐐기'], ['힌지', '힌지·접이'], ['접이', '힌지·접이']];

  function parseQuestion(raw, prevSpec) {
    const text = String(raw == null ? '' : raw).trim();
    const q = text.replace(/\s+/g, '').toLowerCase();
    if (!q) return { kind: 'empty' };
    const idm = text.toUpperCase().match(/DEMO-[A-Z]{2}-\d{4}/);
    if (idm) return { kind: 'doc', docId: idm[0] };
    const mw = MECH_WORDS.find(function (m) { return q.indexOf(m[0]) >= 0; });
    const mechIn = mw ? mw[1] : null;
    if (/걸리|걸릴|침해|회피가능|무효|등록가능|특허받|써도되|문제없/.test(q)) return { kind: 'review', mech: mechIn };
    if (/조건초기화|처음부터|조건해제|조건을모두|모든조건/.test(q)) return { kind: 'resetCtx' };
    if (/개선안|발명후보|약점|청구항초안|출원안|신규ip/.test(q)) return { kind: 'ip' };

    let preset = null;
    if (/해외/.test(q) && /(국내|한국)/.test(q) && /(영향|효력|문제|사업)/.test(q)) preset = { groupBy: 'funnel', unit: 'doc', filters: {}, name: '해외 특허의 국내 영향' };
    else if (/만료예정|캘린더|언제풀|언제만료|풀리/.test(q)) preset = { groupBy: 'expiry', unit: 'doc', filters: { country: 'KR', status: 'alive' }, name: '만료 예정 캘린더' };
    else if (/핵심특허|주의특허|먼저대조|대조할/.test(q)) preset = { groupBy: 'sub', unit: 'doc', filters: { country: 'KR', rel: 'Core', status: 'alive' }, name: '국내 주의 특허' };
    else if (/공백|빈곳|빈칸|빈영역|적게관측|비어/.test(q)) preset = { groupBy: 'matrix', unit: 'doc', filters: { status: 'alive' }, name: '기술 공백' };
    else if (/조사했다면|놓쳤|놓칠/.test(q)) preset = { groupBy: 'mech', unit: 'doc', filters: {}, name: '결합방식 전체' };

    let topic = null;
    if (!preset) {
      if (/수납|캐비닛|선반/.test(q)) topic = { sub: 'A', name: D.SUBS.A };
      else if (/의자|좌판/.test(q)) topic = { sub: 'B', name: D.SUBS.B };
      else if (/테이블|상판|다리/.test(q)) topic = { sub: 'C', name: D.SUBS.C };
      else if (/커넥터|연결구|결합구/.test(q)) topic = { sub: 'D', name: D.SUBS.D };
    }

    let groupBy = null;
    if (/비중|트렌드/.test(q)) groupBy = 'share';
    else if (/추세|연도|동향|해마다|늘고|증가|년단위/.test(q)) groupBy = 'period';
    else if (/권리상태|만료|존속여부|기간이끝|기간끝/.test(q) && !preset) groupBy = 'status';
    else if (/출원인|누가|강자/.test(q)) groupBy = 'applicant';
    else if (/국가별|나라/.test(q)) groupBy = 'country';
    else if (/제품군|기술축|분류별/.test(q)) groupBy = 'sub';
    else if (/결합방식|방식별|수단별|어떤방식|어떤결합|방식은|방식이/.test(q)) groupBy = 'mech';

    const mod = {};
    if (!preset || preset.groupBy !== 'funnel') {
      if (/해외만|외국만/.test(q)) mod.country = 'FOREIGN';
      else if (/전체국가|모든국가|국가조건해제|해외포함/.test(q)) mod.country = null;
      else if (/국내|한국/.test(q)) mod.country = 'KR';
    }
    if (/패밀리/.test(q)) mod.unit = 'family';
    else if (/문헌단위|문헌기준|문헌으로|문헌수/.test(q)) mod.unit = 'doc';
    if (/core만|핵심만|핵심문헌만/.test(q)) mod.rel = 'Core';
    else if (/관련문헌전체|core해제/.test(q)) mod.rel = null;
    if (/존속만|살아있|존속중인/.test(q)) mod.status = 'alive';
    else if (/만료된것만|만료만/.test(q)) mod.status = 'expired';
    if (mechIn && !preset && /그중|중에서|만보|만$|만요|만주|만으로/.test(q)) mod.mech = mechIn;

    const hasMod = Object.keys(mod).length > 0;
    if (!preset && !topic && !groupBy && !hasMod) return { kind: 'unsupported' };

    const prev = prevSpec ? normalizeSpec(prevSpec) : null;
    let spec, newTopic = false, name = null;
    if (preset) {
      spec = { groupBy: groupBy && preset.groupBy === 'sub' ? groupBy : preset.groupBy, unit: preset.unit, filters: clone(preset.filters) };
      newTopic = !!prev; name = preset.name;
    } else if (topic) {
      spec = { groupBy: groupBy || 'mech', unit: 'doc', filters: { sub: topic.sub } };
      newTopic = !!prev; name = topic.name;
    } else if (prev) {
      spec = clone(prev);
      if (groupBy) spec.groupBy = groupBy;
    } else {
      spec = clone(DEFAULT_SPEC);
      if (groupBy) spec.groupBy = groupBy;
    }
    ['country', 'rel', 'status'].forEach(function (k) {
      if (k in mod) { if (mod[k]) spec.filters[k] = mod[k]; else delete spec.filters[k]; }
    });
    if (mod.unit) spec.unit = mod.unit;
    if (mod.mech) spec.filters.mech = mod.mech;
    spec = normalizeSpec(spec);
    return { kind: 'analysis', spec: spec, newTopic: newTopic, topic: name, changes: diffSpec(prev, spec, newTopic) };
  }

  function diffSpec(prev, next, newTopic) {
    const out = { added: [], removed: [], changed: [], kept: [], newTopic: !!newTopic };
    if (!prev) return out;
    if (prev.groupBy !== next.groupBy) out.changed.push('보기: ' + GROUP_LABEL[prev.groupBy] + ' → ' + GROUP_LABEL[next.groupBy]);
    if (prev.unit !== next.unit) out.changed.push('집계 단위: ' + (prev.unit === 'family' ? '패밀리' : '문헌') + ' → ' + (next.unit === 'family' ? '패밀리' : '문헌'));
    FILTER_KEYS.forEach(function (k) {
      const a = prev.filters[k], b = next.filters[k];
      if (a && !b) out.removed.push(FILTER_LABEL[k](a));
      else if (!a && b) out.added.push(FILTER_LABEL[k](b));
      else if (a && b && a !== b) out.changed.push(FILTER_LABEL[k](a) + ' → ' + FILTER_LABEL[k](b).split(': ')[1]);
      else if (a && b) out.kept.push(FILTER_LABEL[k](a));
    });
    return out;
  }

  const SUPPORTED = [
    '출원 추세를 보여 주세요', '그중 국내만', '패밀리 단위로 보여 주세요', '자석 결합만 조사했다면 무엇을 놓쳤나요?',
    '해외 특허가 국내 사업에 영향을 주나요?', '국내 핵심 특허를 보여 주세요', '만료 예정 캘린더', '권리 상태별로 보여 주세요',
    '출원인별로 보여 주세요', '결합방식 비중 트렌드', '공백 후보를 보여 주세요', '의자 관련 결합방식은?',
    '레버 클램프가 특허에 걸리나요?', '개선안을 보여 주세요', 'DEMO-KR-0001', '조건 초기화'
  ];

  function pushMsg(state, m) {
    state.msgSeq += 1;
    m.id = 'MSG-' + pad(state.msgSeq, 4);
    m.at = nowIso();
    state.chat.push(m);
    return m;
  }

  function ask(state, raw) {
    const text = String(raw == null ? '' : raw).trim().slice(0, 300);
    const p = parseQuestion(text, state.ctx ? state.ctx.spec : null);
    if (p.kind === 'empty') return null;
    pushMsg(state, { from: 'user', text: text });
    if (p.kind === 'analysis') {
      const run = runAnalysis(state, p.spec, '물어보기');
      state.ctx = { spec: clone(run.spec), runId: run.id };
      const g = p.spec.groupBy;
      const layer = g === 'matrix' || g === 'share' || (p.topic && g === 'mech') ? 'explain' : (p.spec.filters.rel === 'Core' && p.spec.filters.status === 'alive' ? 'review' : 'calc');
      return pushMsg(state, { from: 'bot', type: 'analysis', runId: run.id, layer: layer, changes: p.changes, topic: p.topic });
    }
    if (p.kind === 'resetCtx') {
      const had = state.ctx ? specChips(state.ctx.spec) : [];
      state.ctx = null;
      return pushMsg(state, { from: 'bot', type: 'info', text: '적용 중이던 조건을 모두 해제했습니다.' + (had.length ? ' (해제: ' + had.join(', ') + ')' : '') });
    }
    if (p.kind === 'ip') return pushMsg(state, { from: 'bot', type: 'ip', layer: 'explain' });
    if (p.kind === 'doc') {
      const d = getDoc(p.docId);
      const inBase = d && baselineOf(state, state.currentBaseline).docIds.indexOf(d.id) >= 0;
      return pushMsg(state, { from: 'bot', type: 'doc', docId: p.docId, found: !!d, inBaseline: !!inBase });
    }
    if (p.kind === 'review') {
      const task = state.tasks.find(function (t) { return t.id === state.activeTaskId; });
      const docs = docsInBaseline(state).filter(function (d) {
        return isAlive(d) && d.rights === 'H' && (p.mech ? d.mechs.indexOf(p.mech) >= 0 : d.sub === task.sub);
      }).sort(function (a, b) { return (a.country === 'KR' ? 0 : 1) - (b.country === 'KR' ? 0 : 1); }).slice(0, 12);
      return pushMsg(state, { from: 'bot', type: 'review', question: text, mech: p.mech, taskId: task.id, docIds: ids(docs), layer: 'review' });
    }
    return pushMsg(state, { from: 'bot', type: 'unsupported', supported: SUPPORTED.slice() });
  }

  function clearCtxFilter(state, key) {
    if (!state.ctx) return null;
    const spec = clone(state.ctx.spec);
    if (key === 'unit') spec.unit = 'doc'; else delete spec.filters[key];
    const prev = state.ctx.spec;
    const run = runAnalysis(state, spec, '물어보기');
    state.ctx = { spec: clone(run.spec), runId: run.id };
    pushMsg(state, { from: 'user', text: '(조건 해제) ' + (key === 'unit' ? '집계 단위' : FILTER_LABEL[key](prev.filters[key])) });
    return pushMsg(state, { from: 'bot', type: 'analysis', runId: run.id, layer: 'calc', changes: diffSpec(prev, run.spec, false) });
  }

  // ---------- 저장·재실행 ----------
  function saveRun(state, runId, title) {
    const run = state.runs[runId];
    if (!run) return { ok: false, reason: '실행 기록 없음' };
    const dup = state.saved.find(function (s) { return s.runId === runId; });
    if (dup) return { ok: false, reason: '이미 저장한 결과입니다', saved: dup };
    state.savedSeq += 1;
    const s = { id: 'SAVE-' + pad(state.savedSeq, 3), runId: runId, title: title || (GROUP_LABEL[run.spec.groupBy] + ' 결과'), savedAt: nowIso() };
    state.saved.push(s);
    return { ok: true, saved: s };
  }

  function rerunSaved(state, savedId) {
    const s = state.saved.find(function (x) { return x.id === savedId; });
    if (!s) return { ok: false, reason: '저장 결과 없음' };
    const old = state.runs[s.runId];
    const run = runAnalysis(state, old.spec, '재실행(' + old.id + ')');
    state.comparisons.push({ savedId: s.id, baseRunId: old.id, newRunId: run.id, at: nowIso() });
    return { ok: true, run: run };
  }

  function rerunCard(state, cardId) {
    const c = state.cards.find(function (x) { return x.id === cardId; });
    if (!c) return { ok: false };
    const last = state.runs[c.runIds[c.runIds.length - 1]];
    if (last.baseline === state.currentBaseline) return { ok: false, reason: '이미 최신 기준선 결과입니다' };
    const run = runAnalysis(state, c.spec, '카드 재계산(' + c.id + ')');
    c.runIds.push(run.id);
    return { ok: true, run: run };
  }

  function compareRuns(a, b) {
    if (a.spec.groupBy === 'matrix') {
      return Object.keys(a.matrix.cells).map(function (k) {
        const p = k.split('|');
        const x = a.matrix.cells[k].count, y = b.matrix.cells[k] ? b.matrix.cells[k].count : null;
        return { label: p[0] + ' × ' + D.SUB_SHORT[p[1]], before: x, after: y, diff: y == null ? null : y - x };
      });
    }
    const keys = []; const seen = {};
    a.rows.concat(b.rows).forEach(function (r) { if (!seen[r.key]) { seen[r.key] = 1; keys.push(r); } });
    return keys.map(function (r) {
      const x = a.rows.find(function (q) { return q.key === r.key; });
      const y = b.rows.find(function (q) { return q.key === r.key; });
      return { label: r.label, before: x ? x.count : null, after: y ? y.count : null, diff: x && y ? y.count - x.count : null };
    }).concat([{ label: '합계(조건 내 문헌)', before: a.totals.docs, after: b.totals.docs, diff: b.totals.docs - a.totals.docs, total: true },
      { label: '합계(고유 패밀리)', before: a.totals.families, after: b.totals.families, diff: b.totals.families - a.totals.families, total: true }]);
  }

  // ---------- 전문 검토 요청 ----------
  function normKey(s) { return String(s || '').replace(/[\s?？.!]/g, '').toLowerCase(); }

  function requestReview(state, msgId) {
    const m = state.chat.find(function (x) { return x.id === msgId; });
    if (!m || m.type !== 'review') return { ok: false, reason: '검토 대상 질문이 아닙니다' };
    const key = normKey(m.question) + '|' + m.taskId;
    const dup = state.requests.find(function (r) { return r.key === key; });
    if (dup) { m.requestId = dup.id; return { ok: false, reason: '이미 접수된 요청입니다 (' + dup.id + ')', request: dup }; }
    state.reqSeq += 1;
    const r = { id: 'REQ-' + pad(state.reqSeq, 3), key: key, question: m.question, taskId: m.taskId, mech: m.mech,
      docIds: m.docIds.slice(), baseline: state.currentBaseline, status: '검토 요청됨', createdAt: nowIso(), answer: null };
    state.requests.push(r);
    m.requestId = r.id;
    return { ok: true, request: r };
  }

  function publishAnswer(state, reqId) {
    const r = state.requests.find(function (x) { return x.id === reqId; });
    if (!r) return { ok: false, reason: '요청 없음' };
    if (r.status === '답변 공개') return { ok: false, reason: '이미 공개된 답변입니다' };
    const task = state.tasks.find(function (t) { return t.id === r.taskId; });
    const refs = r.docIds.slice(0, 2);
    r.answer = {
      reviewer: '담당 FDE(가상) · 가상 검토 의견 예시',
      issue: (r.mech ? r.mech + ' 구조' : '과제 구성') + '가 ' + (refs.join(', ') || '관련 문헌') + '의 가상 청구항 1 구성요소를 모두 갖추는지',
      premise: '과제 「' + task.title + '」의 현재 구성 초안 · 관할 KR · 기준선 ' + r.baseline + ' · 가상 청구항 기준',
      opinion: '청구항을 구성요소 단위로 나눠 과제 설계안과 하나씩 대조해야 판단할 수 있습니다. 현재 초안에는 레버·래칫·탄성 정압 구성이 있어 일부 요소가 다를 가능성이 있으나, 균등 여부 검토가 필요합니다. 설계 도면을 받은 뒤 대조표를 작성하겠습니다. (가상 예시 — 실제 전문가 의견이 아니며 침해·비침해 결론이 아닙니다)',
      next: '청구항 분해 → 설계안 대조 → 위험도 판정(상·중·하) → 회피 설계 지침'
    };
    r.status = '답변 공개';
    r.publishedAt = nowIso();
    state.unreadAnswers += 1;
    pushMsg(state, { from: 'bot', type: 'reviewAnswer', reqId: r.id, layer: 'published' });
    return { ok: true, request: r };
  }

  // ---------- 후보 영역·기준선 공개 ----------
  function reviewCandidate(state, docId) {
    const c = state.candidates.find(function (x) { return x.docId === docId; });
    if (!c) return { ok: false };
    if (c.reviewed) return { ok: false, reason: '이미 검토 완료' };
    c.reviewed = true; c.reviewedAt = nowIso();
    return { ok: true };
  }

  function canPublish(state) {
    if (baselineOf(state, 'V2')) return { ok: false, reason: 'V2는 이미 공개되었습니다' };
    const left = state.candidates.filter(function (c) { return !c.reviewed; }).length;
    if (left) return { ok: false, reason: '검토하지 않은 후보 ' + left + '건이 남아 있습니다' };
    return { ok: true };
  }

  function aliveMatrix(docs) {
    const out = {};
    docs.filter(isAlive).forEach(function (d) { d.mechs.forEach(function (m) { const k = m + '|' + d.sub; out[k] = (out[k] || 0) + 1; }); });
    return out;
  }

  function publishBaseline(state) {
    const chk = canPublish(state);
    if (!chk.ok) return chk;
    const v1 = baselineOf(state, 'V1');
    const newIds = state.candidates.map(function (c) { return c.docId; });
    const before = docsInBaseline(state, 'V1');
    state.baselines.push({ id: 'V2', approvedAt: today(), approver: D.PROJECT.fde, docIds: v1.docIds.concat(newIds), note: '신규 도착 ' + newIds.length + '건 검토 후 승인(가상)' });
    state.currentBaseline = 'V2';
    const after = docsInBaseline(state, 'V2');
    // 과제 영향: 신규 문헌만으로 결론이 바뀌었다고 단정하지 않고 '확인 필요'로 시작한다.
    state.tasks.forEach(function (t) {
      const hits = newIds.map(getDoc).filter(function (d) {
        return d.sub === t.sub && (d.mechs.some(function (m) { return t.mechs.indexOf(m) >= 0; }) || d.rights === 'H');
      });
      if (hits.length) {
        state.impSeq += 1;
        state.impacts.push({ id: 'IMP-' + pad(state.impSeq, 2), taskId: t.id, docIds: ids(hits), status: '확인 필요',
          reason: '과제의 제품군·관심 결합방식과 겹치는 신규 문헌 ' + hits.length + '건', note: null, history: [{ status: '확인 필요', at: nowIso() }] });
      }
    });
    const mb = aliveMatrix(before), ma = aliveMatrix(after);
    state.gapChanges = Object.keys(ma).filter(function (k) { return !mb[k]; }).map(function (k) {
      const p = k.split('|'); return { cell: p[0] + ' × ' + D.SUB_SHORT[p[1]], count: ma[k] };
    });
    return { ok: true };
  }

  const IMPACT_FLOW = ['확인 필요', '검토 중', '승인된 설명'];
  function advanceImpact(state, id) {
    const im = state.impacts.find(function (x) { return x.id === id; });
    if (!im) return { ok: false };
    const i = IMPACT_FLOW.indexOf(im.status);
    if (i >= IMPACT_FLOW.length - 1) return { ok: false, reason: '이미 승인된 설명입니다' };
    im.status = IMPACT_FLOW[i + 1];
    im.history.push({ status: im.status, at: nowIso() });
    if (im.status === '승인된 설명') {
      im.note = '신규 문헌 ' + im.docIds.join(', ') + '을(를) 검토했습니다. 기존 카드의 결론을 바꿀 근거로 확정하지 않았으며, 과제 담당자와 구성 차이를 확인하도록 안내합니다. (가상 설명)';
    }
    return { ok: true, impact: im };
  }

  // ---------- 개발과제 수정 ----------
  function updateTask(state, taskId, patch) {
    const t = state.tasks.find(function (x) { return x.id === taskId; });
    if (!t) return { ok: false };
    const next = {
      problem: String(patch.problem == null ? t.problem : patch.problem).trim().slice(0, 500),
      constraints: (Array.isArray(patch.constraints) ? patch.constraints : String(patch.constraints || '').split('\n'))
        .map(function (s) { return String(s).trim().slice(0, 120); }).filter(Boolean).slice(0, 12),
      decisionDate: /^\d{4}-\d{2}-\d{2}$/.test(patch.decisionDate || '') ? patch.decisionDate : t.decisionDate
    };
    if (!next.problem) return { ok: false, reason: '해결하려는 문제를 비워 둘 수 없습니다' };
    t.history.push({ at: nowIso(), by: '연구자', before: { problem: t.problem, constraints: t.constraints.slice(), decisionDate: t.decisionDate } });
    t.problem = next.problem; t.constraints = next.constraints; t.decisionDate = next.decisionDate;
    t.editedBy = '연구자 수정';
    return { ok: true, task: t };
  }

  // ---------- 국내 핵심 특허 대조표 (청구항 요소 × 과제 설계안) ----------
  // 예비 분류는 컨설턴트 작업용이며, 연구자에게는 검토 의견이 공개된 뒤에만 보인다.
  function riskPrelim(elements) {
    if (elements.every(function (e) { return e[1] === '해당'; })) return '상';
    if (elements.some(function (e) { return e[1] === '비해당' && e[2]; })) return '하';
    return '중';
  }
  function riskRows(state) {
    const base = baselineOf(state, state.currentBaseline).docIds;
    return D.DOCS.filter(function (d) { return d.elements && base.indexOf(d.id) >= 0; }).map(function (d) {
      const r = state.risk[d.id] || { status: '검토 대기' };
      return { docId: d.id, elements: d.elements, prelim: riskPrelim(d.elements), status: r.status, publishedAt: r.publishedAt || null };
    });
  }
  function publishRisk(state, docId) {
    const d = getDoc(docId);
    if (!d || !d.elements) return { ok: false, reason: '대조 대상이 아닙니다' };
    if (state.risk[docId] && state.risk[docId].status === '의견 공개') return { ok: false, reason: '이미 공개된 판정입니다' };
    state.risk[docId] = { status: '의견 공개', grade: riskPrelim(d.elements), publishedAt: nowIso() };
    return { ok: true };
  }

  const IC_FLOW = ['제안됨', '추가 조사 중', '기술검증 중', '전문 검토 중', '채택'];
  function advanceCandidate(state, id) {
    const c = state.ipCandidates.find(function (x) { return x.id === id; });
    if (!c) return { ok: false };
    const i = IC_FLOW.indexOf(c.status);
    if (i >= IC_FLOW.length - 1) return { ok: false, reason: '이미 채택된 후보입니다' };
    c.status = IC_FLOW[i + 1];
    c.history.push({ status: c.status, at: nowIso() });
    return { ok: true, candidate: c };
  }

  // ---------- 프로젝트 요약 수치 (모두 현재 기준선 배열에서 계산) ----------
  function projectStats(state) {
    const docs = docsInBaseline(state);
    const n = docs.length;
    const foreign = docs.filter(function (d) { return d.country !== 'KR'; });
    const fAlive = foreign.filter(isAlive);
    const fKr = fAlive.filter(function (d) { return d.krFamily; });
    const apps = {};
    docs.forEach(function (d) { apps[d.applicant] = (apps[d.applicant] || 0) + 1; });
    const appVals = Object.keys(apps).map(function (k) { return apps[k]; });
    const kr = docs.filter(function (d) { return d.country === 'KR'; });
    const recent = docs.filter(function (d) { return d.year >= 2020; });
    const early = docs.filter(function (d) { return d.year <= 1999; });
    const has = function (arr, m) { return arr.filter(function (d) { return d.mechs.indexOf(m) >= 0; }).length; };
    const mechTotal = docs.reduce(function (a, d) { return a + d.mechs.length; }, 0);
    return {
      docs: n, families: uniqueFamilies(docs),
      core: docs.filter(function (d) { return d.rel === 'Core'; }).length,
      coreBy: Object.keys(D.SUBS).reduce(function (o, s) { o[s] = docs.filter(function (d) { return d.rel === 'Core' && d.sub === s; }).length; return o; }, {}),
      usPct: pct(docs.filter(function (d) { return d.country === 'US'; }).length, n),
      expired: docs.filter(function (d) { return d.status === '만료 추정'; }).length,
      expiredPct: pct(docs.filter(function (d) { return d.status === '만료 추정'; }).length, n),
      applicants: appVals.length, singlePct: pct(appVals.filter(function (v) { return v === 1; }).length, appVals.length), maxApp: appVals.length ? Math.max.apply(null, appVals) : 0,
      avgMechs: n ? Math.round(mechTotal * 10 / n) / 10 : 0,
      magnet: has(docs, '자석'), magnetPct: pct(has(docs, '자석'), n),
      foreignAlive: fAlive.length, foreignKr: fKr.length, noKrPct: 100 - pct(fKr.length, fAlive.length),
      kr: kr.length, krAlive: kr.filter(isAlive).length, krCoreAlive: kr.filter(function (d) { return d.rel === 'Core' && isAlive(d); }).length,
      krIndPct: pct(kr.filter(function (d) { return d.appType === '개인'; }).length, kr.length),
      krUtilPct: pct(kr.filter(function (d) { return d.kind === '실용신안'; }).length, kr.length),
      shapeEarly: pct(has(early, '형상맞물림'), early.length), shapeRecent: pct(has(recent, '형상맞물림'), recent.length),
      magnetEarly: pct(has(early, '자석'), early.length), magnetRecent: pct(has(recent, '자석'), recent.length),
      yearMin: n ? Math.min.apply(null, docs.map(function (d) { return d.year; })) : 0, yearMax: n ? Math.max.apply(null, docs.map(function (d) { return d.year; })) : 0
    };
  }

  // 시사점: 계산된 수치를 끼워 넣는 고정 문장. 새 수치를 만들지 않는다.
  function insights(state) {
    const s = projectStats(state);
    return [

  // ---------- 찾아보기 ----------
  function expandQuery(q) {
    const words = String(q || '').trim().split(/\s+/).filter(Boolean);

      terms.add(w);
      D.GLOSSARY.forEach(function (g) {
        if (w.indexOf(g.term) >= 0 || g.expand.indexOf(w) >= 0) {

  // ---------- CSV ----------
  function csvCell(v) {

    } else if (run.spec.groupBy === 'share') {

      run.rows.forEach(function (r, i) { add([r.label, r.count].concat(D.MECHS.map(function (m) { return run.series[m][i]; }))); });
    } else {
      add([GROUP_LABEL[run.spec.groupBy], u]);
      run.rows.forEach(function (r) { add([r.label, r.count]); });
    }
    lines.push('');
    add(['근거 문헌 ID', '가상 패밀리', '국가', '출원연도', '제품군', '결합방식', '관련도', '권리 상태', '가상 출원인', '제목']);
    run.docIds.forEach(function (id) {
      const d = getDoc(id);
      add([d.id, d.familyId, d.country, d.year, D.SUBS[d.sub], d.mechs.join('+'), d.rel, d.status, d.applicant, d.title]);

  }

  // ---------- 상태 생성·저장 ----------
  function pickEvidence(run) {

    docsInBaseline: docsInBaseline, baselineOf: baselineOf, candidateDocs: candidateDocs, uniqueFamilies: uniqueFamilies,

    parseQuestion: parseQuestion, ask: ask, clearCtxFilter: clearCtxFilter,
    saveRun: saveRun, rerunSaved: rerunSaved, rerunCard: rerunCard, compareRuns: compareRuns,
    requestReview: requestReview, publishAnswer: publishAnswer,
    reviewCandidate: reviewCandidate, canPublish: canPublish, publishBaseline: publishBaseline, advanceImpact: advanceImpact,
    updateTask: updateTask, riskRows: riskRows, riskPrelim: riskPrelim, publishRisk: publishRisk, advanceCandidate: advanceCandidate, IC_FLOW: IC_FLOW,

    saveToStorage: saveToStorage, loadFromStorage: loadFromStorage, clearStorage: clearStorage, STORE_KEY: STORE_KEY
  };
})(typeof window !== 'undefined' ? window : globalThis);

    ticks.forEach(function (t) {
      const x = pl + pw * t / top;
      g += '<line class="' + (t ? 'grid' : 'axis') + '" y1="' + pt + '" y2="' + (H - 20) + '" x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '"/><text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + '</text>';
    });
    rows.forEach(function (r, i) {
      const y = pt + i * rh + 7, bh = rh - 14, w = pw * r.count / top, rr = Math.min(7, bh / 2, w);
      const path = r.count ? 'M' + pl + ',' + y + 'H' + (pl + w - rr).toFixed(1) + 'Q' + (pl + w).toFixed(1) + ',' + y + ' ' + (pl + w).toFixed(1) + ',' + (y + rr).toFixed(1) + 'V' + (y + bh - rr).toFixed(1) + 'Q' + (pl + w).toFixed(1) + ',' + (y + bh) + ' ' + (pl + w - rr).toFixed(1) + ',' + (y + bh) + 'H' + pl + 'Z'
        : 'M' + pl + ',' + y + 'h2v' + bh + 'h-2Z';
      g += '<g class="bar-g"' + tipAttrs(r.label, r.count, unit) + '><rect class="hit" x="0" y="' + (y - 7) + '" width="' + W + '" height="' + rh + '"/>' +
        '<text x="' + (pl - 12) + '" y="' + (y + bh / 2 + 4) + '" text-anchor="end" class="lab">' + esc(r.label.length > 17 ? r.label.slice(0, 16) + '…' : r.label) + '</text>' +
        '<path class="bar' + (r.count ? '' : ' zero') + '" d="' + path + '" fill="url(#fde-gh)"/>' +
        '<text class="val" x="' + (pl + w + 8).toFixed(1) + '" y="' + (y + bh / 2 + 4) + '">' + r.count + '</text></g>';
    });
    return '<svg class="chart h" viewBox="0 0 ' + W + ' ' + H + '" aria-label="' + esc((F.GROUP_LABEL[run.spec.groupBy] || '') + ' ' + unit) + '">' + g + '</svg>';
  }

  // 시기별 비중: 두 방식만 선으로 강조하고 나머지는 표로 둔다.
  function lineChart(run) {
    const W = 640, H = 250, pl = 40, pr = 120, pt = 16, pb = 30, pw = W - pl - pr, ph = H - pt - pb, n = run.rows.length;
    const HL = [['형상맞물림', '#2a78d6', 'fde-area-1'], ['자석', '#eb6834', 'fde-area-2']];
    let g = '';
    [0, 25, 50, 75, 100].forEach(function (t) {
      const y = pt + ph - ph * t / 100;
      g += '<line class="' + (t ? 'grid' : 'axis') + '" x1="' + pl + '" x2="' + (pl + pw) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + t + '%</text>';
    });
    const X = function (i) { return pl + (n > 1 ? pw * i / (n - 1) : pw / 2); };
    run.rows.forEach(function (r, i) { g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(r.label) + '</text>'; });
    HL.forEach(function (h) {
      const vals = run.series[h[0]];
      const pts = vals.map(function (v, i) { return [X(i), pt + ph - ph * v / 100]; });
      const d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('');
      g += '<path d="' + d + 'L' + pts[pts.length - 1][0].toFixed(1) + ',' + (pt + ph) + 'L' + pts[0][0].toFixed(1) + ',' + (pt + ph) + 'Z" fill="url(#' + h[2] + ')"/>';
      g += '<path d="' + d + '" fill="none" stroke="' + h[1] + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      pts.forEach(function (p, i) {
        g += '<g class="bar-g"' + tipAttrs(h[0] + ' · ' + run.rows[i].label, vals[i], '%') + '><circle class="hit" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="13"/><circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" fill="' + h[1] + '" stroke="#fff" stroke-width="2"/></g>';
      });
      const last = pts[pts.length - 1];
      g += '<circle cx="' + (last[0] + 14) + '" cy="' + (last[1] - 4) + '" r="4" fill="' + h[1] + '"/><text class="val" x="' + (last[0] + 22) + '" y="' + last[1].toFixed(1) + '">' + esc(h[0]) + ' ' + vals[vals.length - 1] + '%</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-label="시기별 결합방식 비중">' + g + '</svg>' +
      '<div class="heat-legend">' + HL.map(function (h) { return '<span class="lkey" style="background:' + h[1] + '"></span>' + esc(h[0]); }).join(' ') + '<span class="spacer"></span><span>나머지 방식은 아래 표</span></div>';
  }

  function chartCard(run) {
    if (run.spec.groupBy === 'matrix') return '';
    if (run.spec.groupBy === 'share') return '<div class="chart-card"><div class="chart-head"><b style="color:var(--ink-2)">시기별 결합방식 비중(%)</b><span class="spacer"></span>기준선 ' + esc(run.baseline) + ' · ' + esc(run.id) + '</div>' + lineChart(run) + '</div>';
    return '<div class="chart-card"><div class="chart-head"><span class="key" aria-hidden="true"></span><b style="color:var(--ink-2)">' + esc(F.GROUP_LABEL[run.spec.groupBy]) + ' ' + (run.spec.unit === 'family' ? '패밀리 수' : '문헌 수') + '</b><span class="spacer"></span>기준선 ' + esc(run.baseline) + ' · ' + esc(run.id) + '</div>' + chartSvg(run) + '</div>';
  }

  function resultTable(run) {
    const u = run.spec.unit === 'family' ? '패밀리 수' : '문헌 수';
    const un = run.spec.unit === 'family' ? '개 패밀리' : '건';
    if (run.spec.groupBy === 'matrix') {
      const RAMP = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];
      const maxC = Math.max(1, Math.max.apply(null, Object.keys(run.matrix.cells).map(function (k) { return run.matrix.cells[k].count; })));
      let h = '<div style="overflow-x:auto"><table class="heat"><caption class="sr">결합방식 × 제품군 ' + u + '</caption><thead><tr><th></th>' +
        run.matrix.cols.map(function (c) { return '<th class="num" style="text-align:center">' + esc(D.SUB_SHORT[c]) + '</th>'; }).join('') + '</tr></thead><tbody>';
      run.matrix.rows.forEach(function (m) {
        h += '<tr><th>' + esc(m) + '</th>' + run.matrix.cols.map(function (c) {
          const n = run.matrix.cells[m + '|' + c].count;
          const idx = n ? Math.max(0, Math.round((n / maxC) * (RAMP.length - 1))) : -1;
          const style = n ? ' style="background:' + RAMP[idx] + ';color:' + (idx >= 3 ? '#fff' : '#0d366b') + '"' : '';
          return '<td class="mcell ' + (n === 0 ? 'zero' : n <= 2 ? 'low' : '') + '"' + style + tipAttrs(m + ' × ' + D.SUB_SHORT[c], n, un) + '>' + n + '</td>';
        }).join('') + '</tr>';
      });
      return h + '</tbody></table></div><div class="heat-legend"><span>적음</span><span class="ramp" aria-hidden="true"></span><span>많음</span><span class="spacer"></span><span>빗금 칸 = 관측 0</span></div><p class="small muted">셀 값은 ' + u + '입니다. 0은 이 가상 배열에서 관측되지 않았다는 뜻이며, 비어 있는 칸이 곧 발명 가능 영역이라는 뜻은 아닙니다.</p>';
    }
    if (run.spec.groupBy === 'share') {
      let h = '<div class="tablewrap"><table><thead><tr><th>시기</th><th class="num">' + u + '</th>' + D.MECHS.map(function (m) { return '<th class="num">' + esc(m) + '</th>'; }).join('') + '</tr></thead><tbody>';
      run.rows.forEach(function (r, i) { h += '<tr><td>' + esc(r.label) + '</td><td class="num">' + r.count + '</td>' + D.MECHS.map(function (m) { return '<td class="num">' + run.series[m][i] + '%</td>'; }).join('') + '</tr>'; });
      return h + '</tbody></table></div>';
    }
    let h = '<div class="tablewrap"><table><thead><tr><th>' + esc(F.GROUP_LABEL[run.spec.groupBy]) + '</th><th class="num">' + u + '</th><th>해당 문헌</th></tr></thead><tbody>';
    run.rows.forEach(function (r) {
      h += '<tr><td>' + esc(r.label) + '</td><td class="num">' + r.count + '</td><td class="small muted">' + (r.docIds.length ? r.docIds.length + '건' : '—') + '</td></tr>';
    });
    h += '</tbody><tfoot><tr><th>조건 내 전체</th><th class="num">' + (run.spec.unit === 'family' ? run.totals.families : run.totals.docs) + '</th><th class="small muted">문헌 ' + run.totals.docs + '건 · 고유 패밀리 ' + run.totals.families + '개</th></tr></tfoot></table></div>';
    return h;
  }

  function condChips(spec, removable) {
    return F.specChips(spec).map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join(' ');
  }

  function runBlock(run, opts) {
    opts = opts || {};
    const lines = F.describeRun(run);
    let h = '<div class="sec"><div class="sec-title">결론</div>' + lines.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
    if (opts.explain && run.spec.groupBy === 'mech') {
      h += '<div class="sec"><div class="sec-title">가상 설명 · 미검토</div><ul class="small" style="margin:0;padding-left:18px">' +
        run.rows.filter(function (r) { return r.count; }).map(function (r) { return '<li><b>' + esc(r.label) + '</b>: ' + esc(F.MECH_EXPLAIN[r.key]) + '</li>'; }).join('') + '</ul></div>';
    }
    h += '<div class="sec"><div class="sec-title">결과</div>' + chartCard(run) + resultTable(run) + '</div>';
    h += '<div class="sec"><div class="sec-title">조건</div><div class="row"><span class="chip"><b>기준선 ' + esc(run.baseline) + '</b></span><span class="chip">실행 ' + esc(run.id) + '</span>' + condChips(run.spec) + '</div></div>';
    const ev = run.docIds;
    h += '<div class="sec"><div class="sec-title">근거 문헌 (' + ev.length + '건)</div><div class="row">' + ev.slice(0, 8).map(docChip).join('') +
      (ev.length > 8 ? '<details><summary class="small">나머지 ' + (ev.length - 8) + '건 보기</summary><div class="row" style="margin-top:6px">' + ev.slice(8).map(docChip).join('') + '</div></details>' : '') + '</div></div>';
    if (opts.actions !== false) {
      const saved = state.saved.find(function (s) { return s.runId === run.id; });
      h += '<div class="sec"><div class="sec-title">다음 행동</div><div class="row">' +
        (saved ? '<span class="badge b-calc">저장됨 ' + esc(saved.id) + '</span>' : '<button class="btn small primary" data-act="save" data-id="' + esc(run.id) + '">결과 저장</button>') +
        '<button class="btn small" data-act="csv" data-id="' + esc(run.id) + '">CSV 내려받기</button>' +
        (opts.followups || '') + '</div></div>';
    }
    return h;
  }

  function changesNote(ch) {
    if (!ch) return '';
    const parts = [];
    if (ch.newTopic) parts.push('<b>새 주제로 분석합니다.</b>');
    if (ch.kept.length) parts.push('유지: ' + ch.kept.map(esc).join(', '));
    if (ch.added.length) parts.push('추가: ' + ch.added.map(esc).join(', '));
    if (ch.changed.length) parts.push('변경: ' + ch.changed.map(esc).join(', '));
    if (ch.removed.length) parts.push('해제: ' + ch.removed.map(esc).join(', '));
    if (!parts.length) return '';
    return '<div class="note ' + (ch.newTopic || ch.removed.length ? 'warn' : '') + '">조건 변화 — ' + parts.join(' · ') + '</div>';
  }

  // ---------- 화면: 오늘 볼 것 ----------
  function viewToday() {
    const t = task(state.activeTaskId);
    const related = state.cards.filter(function (c) { return c.tasks.indexOf(t.id) >= 0; });
    const answered = state.requests.filter(function (r) { return r.status === '답변 공개'; });
    const openImpacts = state.impacts.filter(function (i) { return i.status !== '승인된 설명'; });
    const bd = F.docsInBaseline(state);
    let h = '<section class="hero"><div class="eyebrow">Today · 기준선 ' + esc(state.currentBaseline) + '</div><h1>오늘 볼 것</h1><p>내 개발과제와 연결된 결과를 먼저 보여 드립니다. 질문하지 않아도 예전 결과를 다시 만날 수 있습니다.</p>';
    h += '<div class="tabs" role="group" aria-label="개발과제 선택">' + state.tasks.map(function (x) {
      return '<button data-act="task-select" data-id="' + x.id + '" aria-pressed="' + (x.id === t.id) + '">' + esc(x.title) + '</button>';
    }).join('') + '</div>';
    h += '<div class="hero-task"><div class="row"><h3>내 과제 · ' + esc(t.title) + '</h3><span class="badge ' + (t.editedBy === 'FDE 초안' ? 'b-neutral' : 'b-info') + '">' + esc(t.editedBy) + '</span><span class="spacer"></span><span class="meta">결정 시점 ' + esc(t.decisionDate) + '</span></div>' +
      '<p style="margin:8px 0 4px;color:#eef1ff">' + esc(t.problem) + '</p><div class="meta">제약: ' + t.constraints.map(esc).join(' · ') + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn small" data-act="nav" data-id="tasks">과제 고치기</button></div></div>';
    const st = F.projectStats(state);
    h += '<div class="stats"><div class="stat"><div class="k">관련 문헌</div><div class="v">' + bd.length + '<small>건</small></div></div>' +
      '<div class="stat"><div class="k">Core 문헌</div><div class="v">' + st.core + '<small>건</small></div></div>' +
      '<div class="stat"><div class="k">연결 카드</div><div class="v">' + related.length + '<small>개</small></div></div>' +
      '<div class="stat"><div class="k">' + (state.currentBaseline === 'V1' ? '정리 중 후보' : '영향 확인 중') + '</div><div class="v">' + (state.currentBaseline === 'V1' ? state.candidates.length : openImpacts.length) + '<small>건</small></div></div></div></section>';

    // 소식
    let news = '';
    if (state.currentBaseline === 'V1') news += '<div class="note">새로 도착(정리 중) <b>' + state.candidates.length + '건</b> — 컨설턴트 검토 전이라 검색·집계에 포함하지 않습니다.</div>';
    else news += '<div class="note warn">기준선 <b>V2</b>가 공개되었습니다. 과제 영향 확인 <b>' + openImpacts.length + '건</b>이 진행 중입니다. <button class="link" data-act="nav" data-id="updates">새로 달라진 점 보기</button></div>';
    if (answered.length) news += '<div class="note ok">전문 검토 답변(가상 예시) <b>' + answered.length + '건</b>이 도착했습니다. <button class="link" data-act="nav" data-id="ask">물어보기에서 보기</button></div>';
    news += '<div class="note">분석 리포트에 시사점 6가지가 정리되어 있습니다. <button class="link" data-act="nav" data-id="report">분석 리포트 보기</button> · 신규 IP 후보 ' + state.ipCandidates.length + '건 <button class="link" data-act="nav" data-id="ip">신규 IP 창출 보기</button></div>';
    h += '<h2>새 소식</h2>' + news;

    h += '<h2>이 과제와 연결된 결과 카드</h2><div class="grid2">' + related.map(cardItem).join('') + '</div>';
    const others = state.cards.filter(function (c) { return related.indexOf(c) < 0; });
    if (others.length) h += '<h2>다른 과제의 카드</h2><div class="grid3">' + others.map(cardItem).join('') + '</div>';
    h += '<h2>바로 물어보기</h2><div class="examples">' + ['출원 추세를 보여 주세요', '해외 특허가 국내 사업에 영향을 주나요?', '국내 핵심 특허를 보여 주세요', '공백 후보를 보여 주세요'].map(function (q) {
      return '<button data-act="quick-ask" data-q="' + esc(q) + '">' + esc(q) + '</button>';
    }).join('') + '</div>';
    return h;
  }

  function cardItem(c) {
    const last = state.runs[c.runIds[c.runIds.length - 1]];
    const stale = last.baseline !== state.currentBaseline;
    const layer = LAYER[c.layer];
    return '<button class="card-item" data-act="card" data-id="' + c.id + '"><div class="row"><span class="badge b-neutral">' + esc(c.type) + '</span><span class="badge ' + layer[0] + '">' + esc(c.layer === 'calc' ? '계산 결과' : c.layer === 'explain' ? '가상 설명' : '검토 필요 표시') + '</span>' +
      (stale ? '<span class="badge b-pending">최신 기준선 재계산 가능</span>' : '') + '</div><div class="q">' + esc(c.title) + '</div>' +
      '<div class="small muted">' + esc(c.report) + ' · 기준선 ' + esc(last.baseline) + '</div></button>';
  }

  // ---------- 화면: 물어보기 ----------
  function viewAsk() {
    let h = '<h1>물어보기</h1><p class="lead">수치는 승인된 기준선 배열에서 계산합니다. 응답은 규칙 기반이며 실제 AI가 연결되어 있지 않습니다.</p>';
    h += '<div class="condbar"><div class="row"><span class="small muted">적용 중인 조건</span>';
    if (state.ctx) {
      const s = state.ctx.spec;
      h += '<span class="chip"><b>기준선 ' + esc(state.currentBaseline) + '</b></span><span class="chip">' + esc(F.GROUP_LABEL[s.groupBy]) + '</span>';
      h += '<span class="chip">집계 단위: ' + (s.unit === 'family' ? '패밀리' : '문헌') + (s.unit === 'family' ? ' <button aria-label="집계 단위 해제" data-act="clear-filter" data-id="unit">×</button>' : '') + '</span>';
      Object.keys(s.filters).forEach(function (k) {
        h += '<span class="chip">' + esc(F.specChips({ groupBy: s.groupBy, unit: s.unit, filters: (function () { const o = {}; o[k] = s.filters[k]; return o; })() })[2]) +
          ' <button aria-label="조건 해제" data-act="clear-filter" data-id="' + k + '">×</button></span>';
      });
      h += '<button class="btn small" data-act="quick-ask" data-q="조건 초기화">조건 초기화</button>';
    } else {
      h += '<span class="chip">없음 — 첫 질문이 기본 조건(기준선 ' + esc(state.currentBaseline) + ' 전체, 문헌 단위)으로 계산됩니다</span>';
    }
    h += '</div></div>';
    h += '<div class="thread" id="thread">';
    if (!state.chat.length) h += '<div class="msg-bot"><b>무엇을 확인할까요?</b><div class="small muted">아래 예시 질문을 누르거나 직접 입력하세요. 지원하지 않는 질문에는 답을 꾸며내지 않고 가능한 질문을 안내합니다.</div></div>';
    state.chat.forEach(function (m) { h += msgHtml(m); });
    h += '</div>';
    h += '<div class="askbox"><form id="ask-form" autocomplete="off"><label class="sr" for="ask-input">질문</label><input id="ask-input" maxlength="300" placeholder="예: 출원 추세를 보여 주세요"><button class="btn primary" type="submit">보내기</button></form>' +
      '<div class="examples">' + F.SUPPORTED.map(function (q) { return '<button data-act="quick-ask" data-q="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div></div>';
    return h;
  }

  function msgHtml(m) {
    if (m.from === 'user') return '<div class="msg-user">' + esc(m.text) + '</div>';
    if (m.type === 'analysis') {
      const run = state.runs[m.runId];
      const fu = [];
      if (run.spec.filters.country !== 'KR') fu.push(['그중 국내만', '국내만']);
      fu.push(run.spec.unit === 'family' ? ['문헌 단위로 보여 주세요', '문헌 단위로'] : ['패밀리 단위로 보여 주세요', '패밀리 단위로']);
      if (run.spec.groupBy !== 'period') fu.push(['출원 추세를 보여 주세요', '추세로']);
      if (run.spec.filters.status !== 'alive') fu.push(['그중 존속만', '존속만']);
      const followups = fu.map(function (x) { return '<button class="btn small" data-act="quick-ask" data-q="' + esc(x[0]) + '">' + esc(x[1]) + '</button>'; }).join('');
      return '<div class="msg-bot" data-run="' + esc(run.id) + '"><div class="row">' + layerBadge(m.layer) + '<span class="small muted">' + esc(run.id) + ' · 기준선 ' + esc(run.baseline) + '</span></div>' +

        '<div class="row" style="margin-top:8px"><button class="btn small" data-act="doc" data-id="' + esc(d.id) + '">가상 원문·근거 열기</button></div></div>';
